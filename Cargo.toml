[workspace]
# resolver 3 is the edition-2024 default and is MSRV-aware (stable since 1.84;
# we pin 1.93). Do not downgrade to "2".
resolver = "3"
members = [
    "crates/shiso-core",
    "crates/shiso-modelfile",
    "crates/shiso-metal",
    "crates/shiso-engine",
    "crates/shiso-models",
    "crates/shiso-kvstore",
    "crates/shiso-ir",
    "crates/shiso-vision",
    "crates/shiso-audio",
    "crates/shiso-runtime",
    "crates/shiso-server",
    "crates/shiso-decision",
    "crates/shiso-bench",
    "crates/shiso-kernels",
    "crates/shiso-cuda",
    "crates/shiso-ple",
    "crates/shiso-media-sys",
    "crates/shiso-parsers",
    "crates/shiso-kerneltest",
    "crates/shiso-router",
    "crates/shiso-hub",
    "crates/shiso-registry",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.98"
license = "MIT"
# Every crate is publish = false. `cargo deny check licenses` skips them through
# `[licenses.private]` in deny.toml, not through the publish flag.

[workspace.dependencies]
# The real-input FFT of the log-mel frontends: planned once per frontend, f64.
realfft = "3"
# Pure-Rust audio decoding for shiso-audio's `decode-native` step. The codec
# list is explicit: mp3, aac and isomp4 are off in symphonia's defaults, and the
# defaults' SIMD and metadata features stay off so the set is the one the
# design names and nothing more.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "mkv"] }
# --- serialization -------------------------------------------------------
# preserve_order keeps JSON object keys in insertion order (IndexMap). The chat
# template renderer must reproduce the transformers `tojson` key order, so this
# is a correctness feature, not a nicety.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# --- errors --------------------------------------------------------------
thiserror = "2"          # library errors
anyhow = "1"             # binary boundaries only (shiso-server, shiso-registry, shiso-router, shiso-bench)

# --- concurrency + logging ----------------------------------------------
parking_lot = "0.12"     # no poisoning, .lock() returns the guard directly
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- HTTP stack ----------------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["json", "multipart"] }
http = "1"
http-body = "1"
hyper = { version = "1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "cors", "fs"] }
tokio = { version = "1", features = ["full", "parking_lot"] }
tokio-stream = "0.1"
futures = "0.3"


# --- router ----------------------------------------------------------------
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "json", "multipart"] }
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.9"
subtle = "2"
bytes = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
wiremock = "0.6"
# --- hub and registry -----------------------------------------------------
indicatif = "0.17"
sysinfo = "0.33"
# Safe statvfs for the hub's free-disk probe; already in the lockfile through other crates.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
semver = { version = "1", features = ["serde"] }
# The hub site renders each model's README: CommonMark in, then sanitized,
# because the README is third-party HTML published under the registry's domain.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
# --- tokenizer + chat templates -----------------------------------------
minijinja = { version = "2", features = ["builtins", "adjacent_loop_items", "json", "preserve_order"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# One pass over caller text for every special-token spelling a vocabulary declares.
aho-corasick = "1"

# --- model files ---------------------------------------------------------
# GGUF is hand-rolled (shiso-modelfile); memmap2 backs the read-only model mapping.
# bytemuck gives zero-copy #[repr(C)] views over quant blocks and fixed headers.
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
safetensors = "0.8"
half = { version = "2", features = ["bytemuck"] }
sha1 = "0.10"
# A Splash package's manifest.json declares a SHA-256 per artifact, and the
# ~20 GB of weights are checked against it before a byte is mapped: a partial
# download that is not caught here becomes a model that loads, runs, and
# answers from bytes that are half another file.
sha2 = "0.10"
hex = "0.4"

# --- vision --------------------------------------------------------------
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
# Matroska/WebM demux for the in-process video decoders. Pure Rust,
# forbid(unsafe_code), no dependencies; Zlib OR MIT OR Apache-2.0.
matroska-demuxer = "0.8"
# The AV1 decoder behind shiso-media-sys's `av1-rav1d` feature (BSD-2-Clause).
# That feature is OFF in every shipped configuration: 1.1.0 aborts the process on
# a damaged tile (upstream issues 1492 and 1497, fixed by PR 1503 on main and
# not yet in a release), which an untrusted upload can cause. Without `asm`: the
# 1.1.0 package does not build with it on aarch64 macOS.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# --- dev -----------------------------------------------------------------
tempfile = "3"

# --- CUDA phase only -----------------------------------------------------
# Declared now so later manifests need only `{ workspace = true }`. No Task 1
# crate references them, so cargo never resolves or downloads them. cudarc is
# driver+nvrtc only - no runtime, no cuBLAS crate. io-uring sits behind a linux
# target table in shiso-ple.
cudarc = { version = "0.19", default-features = false, features = [
    "std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system",
] }
io-uring = "0.7"
# Run-time loading of the NVDEC driver libraries (shiso-media-sys, Linux only).
libloading = "0.9"

# --- Apple Metal ---------------------------------------------------------
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLFunctionConstantValues",
    # `MTLFunctionConstantValues::setConstantValue:type:atIndex:` and the
    # `MTLDataType` constants are gated on this feature.
    "MTLDataType",
    "MTLLibrary",
    "MTLBlitCommandEncoder",
    "MTLEvent",
    # Pipeline reflection: which kernels declare a dynamic threadgroup-memory
    # binding (`MTLArgument` for the binding types, `MTLAllocation` gates the
    # reflecting constructor).
    "MTLArgument",
    "MTLAllocation",
    "block2",
    # `MTLCommandBuffer::GPUStartTime`/`GPUEndTime`, which per-launch profiling
    # reads, are gated on this feature.
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSError"] }
# Page size for the page-aligned no-copy weight wrap (`_SC_PAGESIZE`).
libc = "0.2"

# --- VideoToolbox (shiso-media-sys, macOS target table) -------------------
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-media = { version = "0.3", default-features = false }
objc2-core-video = { version = "0.3", default-features = false }
objc2-video-toolbox = { version = "0.3", default-features = false }
block2 = "0.6"

# --- workspace crates ----------------------------------------------------
shiso-core = { path = "crates/shiso-core" }
shiso-modelfile = { path = "crates/shiso-modelfile" }
shiso-metal = { path = "crates/shiso-metal" }
shiso-engine = { path = "crates/shiso-engine" }
shiso-models = { path = "crates/shiso-models" }
shiso-kvstore = { path = "crates/shiso-kvstore" }
shiso-ir = { path = "crates/shiso-ir" }
shiso-vision = { path = "crates/shiso-vision", default-features = false }
shiso-audio = { path = "crates/shiso-audio", default-features = false }
shiso-runtime = { path = "crates/shiso-runtime", default-features = false }
shiso-server = { path = "crates/shiso-server" }
shiso-decision = { path = "crates/shiso-decision" }
shiso-bench = { path = "crates/shiso-bench" }
shiso-kernels = { path = "crates/shiso-kernels" }
shiso-cuda = { path = "crates/shiso-cuda" }
shiso-ple = { path = "crates/shiso-ple" }
shiso-media-sys = { path = "crates/shiso-media-sys", default-features = false }
shiso-parsers = { path = "crates/shiso-parsers" }
shiso-kerneltest = { path = "crates/shiso-kerneltest" }
shiso-router = { path = "crates/shiso-router" }
shiso-hub = { path = "crates/shiso-hub" }
shiso-registry = { path = "crates/shiso-registry" }
[workspace.lints.rust]
# Safety. Five crates relax this with a crate-level
# #![allow(unsafe_code, reason = "...")]: shiso-modelfile (mmap), shiso-metal (objc2),
# shiso-cuda (driver FFI), shiso-ple (io-uring), shiso-media-sys (OS video decoders).
# Everywhere else it stands.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

# API hygiene. missing_docs was `warn` through the build-out so a half-finished
# crate did not block a commit; Task 20 raised it to "deny", because shipping
# with an undocumented public item is a different matter.
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
# A doc link that names a moved or deleted item is worse than no link: it reads
# as a citation and resolves to nothing. Two of them survived the model
# decoupling, found by the public-surface snapshot rather than by any gate, so
# the gate now exists and `cargo doc` runs in scripts/check.sh.
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Safety + discipline.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "deny"                # use #[expect(...)] so stale ones fail
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"                    # tracing, not println
print_stderr = "deny"
mem_forget = "deny"
exit = "deny"
unwrap_used = "warn"
expect_used = "allow"                    # expect() with a message is fine
indexing_slicing = "allow"
chunks_exact_to_as_chunks = "allow"
manual_checked_ops = "allow"
manual_midpoint = "allow"
duration_suboptimal_units = "allow"

# Deliberately NOT allowed, so they keep firing:
#   too_many_arguments - a 12-argument launch becomes a named Desc struct.
#   type_complexity    - forces closure bundles into named traits.
#   ptr_arg            - &Vec<T> in a signature is always a mistake here.
#   if_same_then_else  - hides copy-paste in kernel dispatch tables.

# An inference engine that never sets these reads as slow for reasons that have
# nothing to do with the kernels.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep frame pointers + line tables: the profiler is how the perf gates get
# diagnosed, and this costs no runtime.
debug = "line-tables-only"
panic = "unwind"   # the HTTP stack's catch-panic layer requires unwinding

[profile.bench]
inherits = "release"

# Line tables are enough for panics, backtraces and the profiler. Full debuginfo
# is paid by every test executable at link time, and the workspace links ~190.
[profile.dev]
debug = "line-tables-only"

# Dequant oracles and golden-vector replays are unusably slow in a debug build of
# their dependencies; the workspace crates stay at opt-level 0 so `cargo test`
# still recompiles fast. Dependencies carry no debuginfo: nothing steps into them.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test.package."*"]
opt-level = 2
debug = false
