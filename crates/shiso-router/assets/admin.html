/// One row per shared device. `grouped` members take turns holding the
/// group's lease; `exempt` members sit on the device but never wait for it.
async function renderGroups() {
  await loadCatalog();
  const membersOf = id => BACKENDS.filter(b => b.exclusive_group_id === id);
  const rows = GROUPS.map(g => {
    const members = membersOf(g.id);
    const chips = members.length
      ? members.map(b => `<span class="mr-1 inline-block rounded bg-neutral-800 px-2 py-0.5 text-xs">
          ${esc(b.name)}<span class="${b.scheduling_class === "grouped" ? "text-amber-400" : "text-neutral-500"}">
            ${b.scheduling_class === "grouped" ? " leased" : " exempt"}</span></span>`).join("")
      : '<span class="text-neutral-600">no members</span>';
    return `<tr class="border-t border-neutral-800">
      <td class="px-4 py-3 font-medium">${esc(g.id)}</td>
      <td class="px-4 py-3">${chips}</td>
      <td class="px-4 py-3 text-sm text-neutral-400">${g.min_hold_ms} ms</td>
      <td class="px-4 py-3 text-sm text-neutral-400">${g.max_hold_ms} ms</td>
      <td class="px-4 py-3 text-sm text-neutral-400">${g.drain_timeout_ms} ms</td>
      <td class="px-4 py-3 text-right text-sm whitespace-nowrap">
        <button onclick='openGroupForm(${esc(JSON.stringify(g.id))})' class="text-sky-400 hover:underline">Edit</button>
        <button onclick='deleteGroup(${esc(JSON.stringify(g.id))})' class="ml-3 text-red-400 hover:underline">Delete</button>
      </td>
    </tr>`;
  }).join("");

  $("#view").innerHTML = `
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-base font-semibold text-white">Exclusive groups</h2>
        <p class="mt-1 text-sm text-neutral-400">Backends sharing one accelerator. At most one
          <span class="text-amber-400">leased</span> member generates at a time;
          <span class="text-neutral-300">exempt</span> members are on the device but never wait.</p>
      </div>
      <button onclick="openGroupForm()" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-500">Add group</button>
    </div>
    ${card(`<table class="w-full text-left">
      <thead><tr class="text-xs uppercase tracking-wide text-neutral-500">
        <th class="px-4 py-3">Group</th><th class="px-4 py-3">Members</th>
        <th class="px-4 py-3">Min hold</th><th class="px-4 py-3">Max hold</th>
        <th class="px-4 py-3">Drain timeout</th><th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="px-4 py-8 text-center text-neutral-600">No groups yet — every backend is scheduled independently.</td></tr>'}</tbody>
    </table>`, "mt-4 overflow-x-auto")}`;
}

function openGroupForm(id) {
  const g = id ? GROUPS.find(x => x.id === id) : null;
  openModal(`
    <h3 class="mb-4 text-base font-semibold text-white">${g ? "Edit group" : "Add group"}</h3>
    <form id="group-form" class="space-y-3">
      <label class="block text-sm">Group id
        ${input("id", `required ${g ? "readonly" : ""} placeholder="dgx"`, g ? g.id : "")}
        ${g ? '<span class="text-xs text-neutral-500">Ids are referenced by backends and cannot be changed.</span>' : ""}
      </label>
      <label class="block text-sm">Min hold (ms)
        ${input("min_hold_ms", 'type="number" min="1" step="1" required', g ? g.min_hold_ms : 5000)}
        <span class="text-xs text-neutral-500">Anti-thrash floor: how long a member keeps the device
          before a waiting peer can take it.</span></label>
      <label class="block text-sm">Max hold (ms)
        ${input("max_hold_ms", 'type="number" min="1" step="1" required', g ? g.max_hold_ms : 30000)}
        <span class="text-xs text-neutral-500">Anti-starvation ceiling: held this long with someone
          waiting, the lease moves regardless.</span></label>
      <label class="block text-sm">Drain timeout (ms)
        ${input("drain_timeout_ms", 'type="number" min="1" step="1" required', g ? g.drain_timeout_ms : 45000)}
        <span class="text-xs text-neutral-500">Watchdog: a drain stuck longer than this force-flips the
          lease and logs an error, rather than wedging the whole device.</span></label>
      <p class="text-xs text-neutral-500">Must satisfy min hold ≤ max hold ≤ drain timeout.</p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" onclick="closeModal()" class="rounded-lg px-3 py-1.5 text-sm text-neutral-400 hover:text-white">Cancel</button>
        <button class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-500">Save</button>
      </div>
    </form>`);

  $("#group-form").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    try {
      const body = {
        min_hold_ms: Number(form.min_hold_ms.value),
        max_hold_ms: Number(form.max_hold_ms.value),
        drain_timeout_ms: Number(form.drain_timeout_ms.value),
      };
      if (g) {
        await api("/admin/groups/" + encodeURIComponent(g.id), { method: "PUT", body: JSON.stringify(body) });
      } else {
        body.id = form.id.value.trim();
        await api("/admin/groups", { method: "POST", body: JSON.stringify(body) });
      }
      closeModal();
      toast("Saved");
      route();
    } catch (err) { toast(err.message); }
  });
}

async function deleteGroup(id) {
  if (!confirm(`Delete group "${id}"? Its members must be moved off it first.`)) return;
  try {
    await api("/admin/groups/" + encodeURIComponent(id), { method: "DELETE" });
    route();
  } catch (err) { toast(err.message); }
}

// ---- logs ------------------------------------------------------------

const LOG_FILTER = { token_id: "", model: "", backend: "", status: "" };
let LOG_CURSOR = null;

// Polled every ACTIVE_POLL_MS while the Logs tab is open. Elapsed times
// therefore tick at that granularity — no client-side clock, so what the
// panel shows is always a number the router actually reported.
const ACTIVE_POLL_MS = 2000;
// A request leaves the panel the moment its guard drops, which is also
// when its log row is handed to the *asynchronous* writer — so the row is
// not queryable for a few more milliseconds. Wait this long before
// re-reading the history, or the refresh races the write it is there for.
const HISTORY_SETTLE_MS = 500;

// Ids from the previous poll. A request that was in flight and no longer
// is has become a history row, which is the cue to re-read the first page.
let ACTIVE_IDS = new Set();

const fmtElapsed = ms => ms < 60000
  ? (ms / 1000).toFixed(1) + "s"
  : Math.floor(ms / 60000) + "m " + String(Math.floor(ms % 60000 / 1000)).padStart(2, "0") + "s";

// `queued` is the router's own admission control holding the request (a
// device lease or a concurrency slot); the other two are the provider's
// time. Colouring them differently is the whole point of the panel.
const PHASES = {
  queued: ["bg-amber-500", "text-amber-400", "queued"],
  upstream: ["bg-sky-500", "text-sky-400", "upstream"],
  streaming: ["bg-emerald-500", "text-emerald-400", "streaming"],
};

/// The Logs filters are applied here rather than on /admin/active: the
/// in-flight set is bounded by the router's concurrency limits, so it is
/// cheaper to filter three fields client-side than to keep a second copy
/// of the filter logic on the server. Status is not filterable — an
/// in-flight request has no status yet.
function activeMatches(r) {
  return (!LOG_FILTER.token_id || r.token_id === LOG_FILTER.token_id)
    && (!LOG_FILTER.model || r.model === LOG_FILTER.model)
    && (!LOG_FILTER.backend || r.backend === LOG_FILTER.backend);
}

function activeRowHtml(r) {
  const [dot, text, label] = PHASES[r.phase] ?? ["bg-neutral-500", "text-neutral-400", r.phase];
  return `
    <tr class="border-t border-neutral-800">
      <td class="whitespace-nowrap px-3 py-2.5 text-sm tabular-nums text-neutral-300">${fmtElapsed(r.elapsed_ms)}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-300">${esc(r.token_name)}</td>
      <td class="px-3 py-2.5 text-sm text-white">${esc(r.model)}${tierBadge(r, "ml-1.5 px-1.5 py-0.5 text-[10px]")}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-400">${esc(r.backend ?? "–")}</td>
      <td class="whitespace-nowrap px-3 py-2.5 text-sm ${text}">
        <span class="mr-1.5 inline-block h-1.5 w-1.5 animate-pulse rounded-full ${dot}"></span>${label}
        ${r.streamed ? '<span class="ml-1 text-[10px] text-neutral-500">SSE</span>' : ""}</td>
      <td class="px-3 py-2.5 font-mono text-xs text-neutral-500">${esc(r.path)}</td>
    </tr>`;
}

/// Renders (or hides) the panel. Hidden when nothing is in flight, so an
/// idle router shows the same Logs page it always did.
function renderActive(items) {
  const host = $("#active");
  if (!host) return;
  if (!items.length) {
    host.innerHTML = "";
    return;
  }
  host.innerHTML = `
    <div class="mt-3 flex items-center gap-2">
      <span class="inline-block h-2 w-2 animate-pulse rounded-full bg-emerald-500"></span>
      <h3 class="text-sm font-semibold text-white">In flight</h3>
      <span class="text-xs text-neutral-500">${items.length} request${items.length === 1 ? "" : "s"}, longest-running first</span>
    </div>
    ${card(`<table class="w-full text-left">
      <thead><tr class="text-xs uppercase tracking-wide text-neutral-500">
        <th class="px-3 py-3">Elapsed</th><th class="px-3 py-3">Key</th><th class="px-3 py-3">Model</th>
        <th class="px-3 py-3">Provider</th><th class="px-3 py-3">Phase</th><th class="px-3 py-3">Endpoint</th>
      </tr></thead>
      <tbody>${items.map(activeRowHtml).join("")}</tbody>
    </table>`, "mt-2 overflow-x-auto")}`;
}

async function loadActive() {
  // A failed poll stops the timer: without this an expired token would
  // raise a toast every two seconds.
  try {
    const page = await api("/admin/active");
    const ids = new Set(page.items.map(r => r.id));
    // Compared against every id, not the count: one request finishing as
    // another starts leaves the count unchanged.
    const finished = [...ACTIVE_IDS].some(id => !ids.has(id));
    ACTIVE_IDS = ids;
    renderActive(page.items.filter(activeMatches));
    if (finished) setTimeout(refreshHistory, HISTORY_SETTLE_MS);
  } catch (e) {
    clearInterval(POLL);
    POLL = null;
    if (e.message !== "unauthorized") toast(e.message);
  }
}

function logQuery() {
  const p = new URLSearchParams();
  if (LOG_FILTER.token_id) p.set("token_id", LOG_FILTER.token_id);
  if (LOG_FILTER.model) p.set("model", LOG_FILTER.model);
  if (LOG_FILTER.backend) p.set("backend", LOG_FILTER.backend);
  if (LOG_FILTER.status) p.set("status", LOG_FILTER.status);
  if (LOG_CURSOR) p.set("cursor", LOG_CURSOR);
  p.set("limit", "50");
  return "/admin/logs?" + p.toString();
}

// prompt_tokens always includes cached_tokens, so this is the fraction of input served from cache.
function cacheRatio(r) {
  return pct(r.cached_tokens, r.prompt_tokens).toFixed(0) + "%";
}

function keyLabel(r) {
  return r.token_name
    ? esc(r.token_name)
    : '<span class="text-neutral-500">deleted key</span>';
}

function logRowHtml(r) {
  const statusCls = r.status == null ? "text-neutral-500"
    : r.status < 300 ? "text-emerald-400" : r.status < 500 ? "text-amber-400" : "text-red-400";
  return `
    <tr class="cursor-pointer border-t border-neutral-800 hover:bg-neutral-800/50" onclick='openLog(${JSON.stringify(r.id)})'>
      <td class="whitespace-nowrap px-3 py-2.5 text-xs text-neutral-400">${fmtDate(r.created_at)}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-300">${keyLabel(r)}</td>
      <td class="px-3 py-2.5 text-sm text-white">${esc(r.model)}${tierBadge(r, "ml-1.5 px-1.5 py-0.5 text-[10px]")}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-400">${esc(r.backend ?? "–")}</td>
      <td class="px-3 py-2.5 text-sm ${statusCls}">${r.status ?? "–"}${r.error ? ' <span title="has error">⚠</span>' : ""}</td>
      <td class="whitespace-nowrap px-3 py-2.5 text-sm">
        <span class="${IN_TEXT}">${fmtInt(r.prompt_tokens)}</span>
        <span class="text-neutral-600">→</span>
        <span class="${OUT_TEXT}">${fmtInt(r.completion_tokens)}</span>
        ${r.cached_tokens ? `<span class="ml-1 rounded bg-sky-500/15 px-1.5 py-0.5 text-[10px] text-sky-400">cached ${cacheRatio(r)}</span>` : ""}</td>
      <td class="px-3 py-2.5 text-sm">${fmtCost(r.cost)}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-400">${r.duration_ms != null ? r.duration_ms + " ms" : "–"}</td>
      <td class="px-3 py-2.5 text-sm text-neutral-400">${esc(r.finish_reason ?? "–")}</td>
    </tr>`;
}

async function renderLogs() {
  LOG_CURSOR = null;
  ACTIVE_IDS = new Set();
  const keys = await api("/admin/tokens");
  $("#view").innerHTML = `
    <h2 class="text-base font-semibold text-white">Request Logs</h2>
    <div class="mt-3 flex flex-wrap items-end gap-2 text-sm">
      <label class="block text-xs text-neutral-500">Key
        <select id="f-key" class="mt-1 block rounded-lg border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm text-neutral-200">
          <option value="">all keys</option>
          ${keys.map(k => `<option value="${esc(k.id)}" ${LOG_FILTER.token_id === k.id ? "selected" : ""}>${esc(k.name)}</option>`).join("")}
        </select></label>
      <label class="block text-xs text-neutral-500">Model
        <select id="f-model" class="mt-1 block rounded-lg border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm text-neutral-200">
          <option value="">all models</option>${modelOptions(LOG_FILTER.model)}
        </select></label>
      <label class="block text-xs text-neutral-500">Provider
        <select id="f-backend" class="mt-1 block rounded-lg border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm text-neutral-200">
          <option value="">all providers</option>
          ${BACKENDS.map(b => `<option value="${esc(b.name)}" ${LOG_FILTER.backend === b.name ? "selected" : ""}>${esc(b.name)}</option>`).join("")}
        </select></label>
      <label class="block text-xs text-neutral-500">Status
        <input id="f-status" value="${esc(LOG_FILTER.status)}" placeholder="e.g. 200" size="6"
          class="mt-1 block rounded-lg border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm"></label>
      <button id="f-apply" class="rounded-lg bg-neutral-800 px-3 py-1.5 text-sm hover:bg-neutral-700">Apply</button>
    </div>
    <div id="active"></div>
    <h3 class="mt-4 text-sm font-semibold text-neutral-400">History</h3>
    ${card(`<table class="w-full text-left">
      <thead><tr class="text-xs uppercase tracking-wide text-neutral-500">
        <th class="px-3 py-3">Time</th><th class="px-3 py-3">Key</th><th class="px-3 py-3">Model</th>
        <th class="px-3 py-3">Provider</th><th class="px-3 py-3">Status</th><th class="px-3 py-3">Tokens</th>
        <th class="px-3 py-3">Cost</th><th class="px-3 py-3">Duration</th><th class="px-3 py-3">Finish</th>
      </tr></thead>
      <tbody id="log-rows"></tbody>
    </table>
    <div class="border-t border-neutral-800 p-3 text-center">
      <button id="log-more" class="hidden rounded-lg bg-neutral-800 px-4 py-1.5 text-sm hover:bg-neutral-700">Load more</button>
      <span id="log-empty" class="hidden text-sm text-neutral-600">No requests logged.</span>
    </div>`, "mt-3 overflow-x-auto")}
    <div id="drawer"></div>`;

  $("#f-apply").addEventListener("click", () => {
    LOG_FILTER.token_id = $("#f-key").value;
    LOG_FILTER.model = $("#f-model").value;
    LOG_FILTER.backend = $("#f-backend").value;
    LOG_FILTER.status = $("#f-status").value.trim();
    refreshHistory();
    loadActive();
  });
  $("#log-more").addEventListener("click", loadLogPage);
  await loadLogPage();
  // The panel is live for as long as this tab is: the router clears POLL
  // on the next navigation.
  await loadActive();
  POLL = setInterval(loadActive, ACTIVE_POLL_MS);
}

/// Re-reads the history from the first page under the current filters —
/// what the Apply button does, and what a finished request triggers. The
/// guard covers a refresh scheduled just before the user navigated away.
function refreshHistory() {
  if (!$("#log-rows")) return;
  $("#log-rows").innerHTML = "";
  LOG_CURSOR = null;
  return loadLogPage();
}

async function loadLogPage() {
  const page = await api(logQuery());
  $("#log-rows").insertAdjacentHTML("beforeend", page.items.map(logRowHtml).join(""));
  LOG_CURSOR = page.next_cursor;
  $("#log-more").classList.toggle("hidden", !page.next_cursor);
  $("#log-empty").classList.toggle("hidden", $("#log-rows").children.length > 0);
}

async function openLog(id) {
  const r = await api("/admin/logs/" + encodeURIComponent(id));
  const field = (label, val, mono = false) => `
    <div class="flex justify-between gap-4 border-b border-neutral-800/60 py-2 text-sm">
      <span class="text-neutral-500">${label}</span>
      <span class="${mono ? "font-mono text-xs" : ""} break-all text-right text-neutral-200">${val}</span>
    </div>`;
  $("#drawer").innerHTML = `
    <div class="fixed inset-0 z-40 bg-black/50" onclick="$('#drawer').innerHTML=''"></div>
    <div class="fixed inset-y-0 right-0 z-50 w-full max-w-md overflow-y-auto border-l border-neutral-800 bg-neutral-900 p-5">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="text-base font-semibold text-white">Request details</h3>
        <button onclick="$('#drawer').innerHTML=''" class="text-neutral-500 hover:text-white">✕</button>
      </div>
      <div class="mb-3 flex gap-2">
        <span class="rounded bg-neutral-800 px-2 py-0.5 text-xs">${esc(r.model)}</span>
        ${r.backend ? `<span class="rounded bg-neutral-800 px-2 py-0.5 text-xs">${esc(r.backend)}</span>` : ""}
        ${r.cached_tokens ? `<span class="rounded bg-sky-500/15 px-2 py-0.5 text-xs text-sky-400">Cached ${cacheRatio(r)}</span>` : ""}
        ${r.streamed ? '<span class="rounded bg-neutral-800 px-2 py-0.5 text-xs">streamed</span>' : ""}
        ${tierBadge(r, "px-2 py-0.5 text-xs")}
      </div>
      ${field("Time", fmtDate(r.created_at))}
      ${field("Request ID", esc(r.id), true)}
      ${field("Key", keyLabel(r))}
      ${field("Key ID", esc(r.token_id), true)}
      ${field("Path", esc(r.path), true)}
      ${field("Upstream model", esc(r.upstream_model ?? "–"))}
      ${field("Service tier", esc(r.service_tier ?? "default"))}
      ${field("Status", r.status ?? "–")}
      ${field("Finish reason", esc(r.finish_reason ?? "–"))}
      ${field("Prompt tokens", fmtInt(r.prompt_tokens))}
      ${field("Completion tokens", fmtInt(r.completion_tokens))}
      ${field("Cached tokens", r.cached_tokens ? `${fmtInt(r.cached_tokens)} <span class="text-neutral-500">(${cacheRatio(r)} of input)</span>` : fmtInt(r.cached_tokens))}
      ${field("Cache write tokens", fmtInt(r.cache_write_tokens))}
      ${field("Total tokens", fmtInt(r.total_tokens))}
      ${field("Cost", fmtCost(r.cost))}
      ${field("Time to first byte", r.ttfb_ms != null ? r.ttfb_ms + " ms" : "–")}
      ${field("Duration", r.duration_ms != null ? r.duration_ms + " ms" : "–")}
      ${r.error ? `<div class="mt-3 rounded-lg bg-red-500/10 p-3 text-sm text-red-300">${esc(r.error)}</div>` : ""}
    </div>`;
}
</script>
