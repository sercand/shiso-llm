<title>llm-router admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Shiso design tokens as Tailwind colors. Opacity modifiers (bg-card/60) mix toward transparent.
  const shiso = (name) => ({ opacityValue }) => opacityValue === undefined
    ? `var(--shiso-${name})`
    : `color-mix(in oklch, var(--shiso-${name}) calc(${opacityValue} * 100%), transparent)`;
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: shiso("canvas"), card: shiso("card"), fill: shiso("fill"), "fill-hover": shiso("fill-hover"), line: shiso("line"),
          ink: shiso("text"), "ink-2": shiso("text-2"),
          primary: shiso("primary"), "primary-hover": shiso("primary-hover"), "primary-ink": shiso("primary-text"),
          soft: shiso("soft"), "soft-ink": shiso("soft-text"),
          ok: shiso("ok"), "ok-bg": shiso("ok-bg"), warn: shiso("warn"), "warn-bg": shiso("warn-bg"), bad: shiso("bad"), "bad-bg": shiso("bad-bg"),
        },
        fontSize: { xs: ["var(--shiso-text-sm)", "1.4"], sm: ["var(--shiso-text-base)", "1.45"] },
        fontFamily: { sans: ["var(--shiso-font-sans)"], mono: ["var(--shiso-font-mono)"] },
      },
    },
  };
</script>
<style>
/* shiso-design: begin. Vendored from github.com/sercand/shiso-design (packages/css/shiso.css): tokens and components.

:root {

  --shiso-card: oklch(0.995 0.003 255);
  --shiso-fill: oklch(0.945 0.01 255);
  --shiso-fill-hover: oklch(0.922 0.012 255);

  --shiso-primary-hover: oklch(0.38 0.085 160);
  --shiso-primary-text: oklch(0.99 0 0);
  --shiso-soft: oklch(0.95 0.026 160);
  --shiso-soft-text: oklch(0.38 0.085 160);
  --shiso-live: oklch(0.56 0.13 160);
  --shiso-ok: oklch(0.48 0.12 152);

  --shiso-shadow: 0 1px 2px 0px oklch(0.21 0.025 255 / 0.06), 0 10px 28px -14px oklch(0.21 0.025 255 / 0.16);

  --shiso-font-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

  --shiso-weight-regular: 400;
  --shiso-weight-medium: 500;
  --shiso-weight-semibold: 600;
  --shiso-weight-bold: 700;
  --shiso-text-xs: 11px;
  --shiso-text-sm: 12px;
  --shiso-text-lg: 16px;
  --shiso-text-xl: 20px;
  --shiso-text-2xl: 26px;
  --shiso-text-3xl: 34px;
  --shiso-radius-sm: 6px;
  --shiso-radius-control: 10px;
  --shiso-radius-inner: 10px;
  --shiso-radius-card: 16px;
  --shiso-radius-full: 999px;

}

  --shiso-fill: oklch(0.262 0.01 255);

  --shiso-text: oklch(0.955 0.006 255);
  --shiso-text-2: oklch(0.71 0.01 255);
  --shiso-primary: oklch(0.76 0.13 160);
  --shiso-primary-hover: oklch(0.82 0.13 160);
  --shiso-primary-text: oklch(0.18 0.03 160);
  --shiso-soft: oklch(0.3 0.058 160);
  --shiso-soft-text: oklch(0.86 0.09 160);
  --shiso-live: oklch(0.76 0.13 160);
  --shiso-ok: oklch(0.78 0.15 152);
  --shiso-ok-bg: oklch(0.29 0.05 152);
  --shiso-warn: oklch(0.82 0.13 82);
  --shiso-warn-bg: oklch(0.3 0.05 82);

  --shiso-shadow: 0 0 0 1px oklch(1 0 0 / 0.05);
  color-scheme: dark;
}

/* Shiso components for plain HTML. Every rule reads tokens only; no literal colors.
   Put class="shiso" on <body> (or any container) for base typography. */
.shiso, .shiso *, .shiso *::before, .shiso *::after { box-sizing: border-box; }
.shiso {
  margin: 0;
  background: var(--shiso-canvas);
  color: var(--shiso-text);
  font: var(--shiso-weight-regular) var(--shiso-text-base)/1.45 var(--shiso-font-sans);
  -webkit-font-smoothing: antialiased;
}
/* Components set display, which would otherwise beat the hidden attribute. */
.shiso [hidden] { display: none !important; }
.shiso :focus-visible { outline: 2px solid var(--shiso-primary); outline-offset: 2px; }
/* Plain links only: anything with a class (buttons, cards, nav items) styles itself. */
.shiso a:not([class]) { color: var(--shiso-primary); text-decoration: none; }
.shiso a:not([class]):hover { text-decoration: underline; }

/* Type */
.s-h1, .s-h2, .s-h3 { margin: 0; font-weight: var(--shiso-weight-semibold); letter-spacing: -0.012em; text-wrap: balance; }
.s-h1 { font-size: var(--shiso-text-2xl); line-height: 1.15; letter-spacing: -0.02em; }
.s-h2 { font-size: var(--shiso-text-xl); line-height: 1.2; }
.s-h3 { font-size: var(--shiso-text-lg); line-height: 1.3; }
.s-muted { color: var(--shiso-text-2); }
.s-small { font-size: var(--shiso-text-sm); }
.s-num { font-variant-numeric: tabular-nums; }
.s-mono { font-family: var(--shiso-font-mono); font-size: 0.92em; }

/* Layout helpers */
.s-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--shiso-space-2); }
.s-stack { display: grid; gap: var(--shiso-gap); align-content: start; }
.s-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: var(--shiso-gap); }
.s-spacer { flex: 1; }

/* Card: the one lifted surface. Do not nest cards; use .s-inset inside a card. */
.s-card {
  background: var(--shiso-card);
  border-radius: var(--shiso-radius-card);
  padding: var(--shiso-pad);
  box-shadow: var(--shiso-shadow);
  display: grid;
  gap: var(--shiso-gap);
  align-content: start;
  min-width: 0;
}
.s-inset { background: var(--shiso-fill); border-radius: var(--shiso-radius-inner); padding: var(--shiso-space-1) var(--shiso-space-3); }
/* Fields inside an inset sit on the fill, so they take the card color to stay visible. */
.s-inset .s-input, .s-inset .s-select, .s-inset .s-textarea { background: var(--shiso-card); }

/* Button */
.s-btn {
  font: inherit;
  font-weight: var(--shiso-weight-medium);
  height: var(--shiso-control);
  padding: 0 calc(var(--shiso-control) * 0.45);
  border-radius: var(--shiso-radius-control);
  border: 1px solid transparent;
  background: var(--shiso-fill);
  color: var(--shiso-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  cursor: pointer;
  text-decoration: none;
}
.s-btn:hover { background: var(--shiso-fill-hover); text-decoration: none; }
.s-btn--primary { background: var(--shiso-primary); color: var(--shiso-primary-text); }
.s-btn--primary:hover { background: var(--shiso-primary-hover); }
.s-btn--outline { background: transparent; border-color: var(--shiso-line); }
.s-btn--ghost { background: transparent; color: var(--shiso-text-2); }
.s-btn--danger { background: var(--shiso-bad-bg); color: var(--shiso-bad); }
.s-btn--outline:hover, .s-btn--ghost:hover { background: var(--shiso-fill); }
.s-btn--icon { width: var(--shiso-control); padding: 0; }
.s-btn:disabled, .s-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.s-btn svg, .s-nav svg, .s-input svg { width: 1.15em; height: 1.15em; flex: none; }

/* Fields: filled, no border at rest */
.s-field { display: grid; gap: 6px; }
.s-label { font-weight: var(--shiso-weight-medium); font-size: 0.93em; }
.s-hint { color: var(--shiso-text-2); font-size: var(--shiso-text-sm); }
.s-input, .s-select, .s-textarea {
  font: inherit;
  color: var(--shiso-text);
  background: var(--shiso-fill);
  border: 1px solid transparent;
  border-radius: var(--shiso-radius-control);
  height: var(--shiso-control);
  padding: 0 calc(var(--shiso-control) * 0.35);
  width: 100%;
  min-width: 0;
}
.s-textarea { height: auto; min-height: calc(var(--shiso-control) * 2.4); padding-block: 8px; resize: vertical; line-height: 1.45; }
.s-input::placeholder, .s-textarea::placeholder { color: var(--shiso-text-2); }
.s-input:hover, .s-select:hover, .s-textarea:hover { background: var(--shiso-fill-hover); }
.s-input:focus-visible, .s-select:focus-visible, .s-textarea:focus-visible { outline: 2px solid var(--shiso-primary); outline-offset: 0; background: var(--shiso-card); }
.s-input[aria-invalid="true"] { outline: 2px solid var(--shiso-bad); outline-offset: 0; }

/* Checkbox and switch: native inputs, so they work without JavaScript */
.s-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.s-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--shiso-primary); }
.s-switch { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.s-switch input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
  width: 34px; height: 20px; border-radius: var(--shiso-radius-full);
  background: var(--shiso-line); position: relative; transition: background 0.15s;
}
.s-switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--shiso-card); transition: translate 0.15s;
}
.s-switch input:checked { background: var(--shiso-primary); }
.s-switch input:checked::after { translate: 14px 0; background: var(--shiso-primary-text); }

/* Pill: status always pairs a dot with a word */
.s-pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  border-radius: var(--shiso-radius-full); padding: 2px 9px;
  font-size: 0.88em; font-weight: var(--shiso-weight-medium);
  background: var(--shiso-fill); color: var(--shiso-text-2);
}
.s-pill--dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-pill--ok { background: var(--shiso-ok-bg); color: var(--shiso-ok); }
.s-pill--warn { background: var(--shiso-warn-bg); color: var(--shiso-warn); }
.s-pill--bad { background: var(--shiso-bad-bg); color: var(--shiso-bad); }
.s-pill--soft { background: var(--shiso-soft); color: var(--shiso-soft-text); }
/* Live: an agent is working right now. The only place the live color appears. */
.s-pill--live { color: var(--shiso-text); }
.s-pill--live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--shiso-live); box-shadow: 0 0 0 3px color-mix(in oklch, var(--shiso-live) 25%, transparent); }

/* Segmented control: buttons for in-page views, links for routed tabs */
.s-seg { display: inline-flex; gap: 2px; padding: 3px; max-width: 100%; background: var(--shiso-fill); border-radius: var(--shiso-radius-control); }
.s-seg button, .s-seg a {
  font: inherit; font-weight: var(--shiso-weight-medium); border: 0; background: transparent; cursor: pointer; white-space: nowrap;
  color: var(--shiso-text-2); height: calc(var(--shiso-control) - 8px); padding: 0 12px;
  display: inline-flex; align-items: center; text-decoration: none;
  border-radius: calc(var(--shiso-radius-control) - 3px);
}
.s-seg button:hover, .s-seg a:hover { color: var(--shiso-text); text-decoration: none; }
.s-seg button[aria-pressed="true"], .s-seg button[aria-selected="true"], .s-seg a[aria-current] { background: var(--shiso-card); color: var(--shiso-text); box-shadow: var(--shiso-shadow); }

/* Table */
.s-table-wrap { overflow-x: auto; }
.s-table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.s-table th { text-align: left; font-weight: var(--shiso-weight-medium); color: var(--shiso-text-2); font-size: 0.92em; }
.s-table th, .s-table td { padding: calc(var(--shiso-pad) * 0.45) var(--shiso-space-3) calc(var(--shiso-pad) * 0.45) 0; border-bottom: 1px solid var(--shiso-line); white-space: nowrap; }
.s-table tr:last-child td, .s-table td[rowspan] { border-bottom: 0; }
.s-table .s-right { text-align: right; padding-right: 0; }
.s-table .s-wrap { white-space: normal; min-width: 200px; font-weight: var(--shiso-weight-medium); }

/* Key/value rows, diff rows, meter, avatar */
.s-kv { display: grid; gap: 6px; }
.s-kv > div { display: flex; justify-content: space-between; gap: 12px; }
.s-diff > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 7px 0; font-variant-numeric: tabular-nums; }
.s-diff > div + div { border-top: 1px solid var(--shiso-line); }
.s-diff del { color: var(--shiso-text-2); margin-right: 6px; }
.s-diff ins { text-decoration: none; font-weight: var(--shiso-weight-semibold); }
.s-meter { height: 8px; border-radius: var(--shiso-radius-full); background: var(--shiso-fill); overflow: hidden; }
.s-meter > span { display: block; height: 100%; border-radius: inherit; background: var(--shiso-primary); }
.s-avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--shiso-soft); color: var(--shiso-soft-text); font-weight: var(--shiso-weight-semibold); }

/* Small button: table rows and dense toolbars */
.s-btn--sm { height: calc(var(--shiso-control) - 6px); padding: 0 10px; font-size: var(--shiso-text-sm); border-radius: calc(var(--shiso-radius-control) - 2px); }

/* A whole card that is a link */
a.s-card, a.s-card:hover { color: inherit; text-decoration: none; }
a.s-card { transition: box-shadow 0.15s; }
a.s-card:hover, a.s-card:focus-visible { box-shadow: var(--shiso-shadow), 0 0 0 2px var(--shiso-soft); }

/* Chip: a filter you switch on and off (aria-pressed). Not a status; use a pill for that. */
.s-chip {
  font: inherit; font-size: 0.92em; font-weight: var(--shiso-weight-medium); cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  height: calc(var(--shiso-control) - 4px); padding: 0 12px;
  border: 0; border-radius: var(--shiso-radius-full);
  background: var(--shiso-card); color: var(--shiso-text); box-shadow: var(--shiso-shadow);
}
.s-chip:hover { background: var(--shiso-fill); }
.s-chip > span { color: var(--shiso-text-2); font-variant-numeric: tabular-nums; }
.s-chip[aria-pressed="true"] { background: var(--shiso-primary); color: var(--shiso-primary-text); box-shadow: none; }
.s-chip[aria-pressed="true"] > span { color: inherit; opacity: 0.8; }

/* Alert: a message inside the page. Default is informational. */
.s-alert {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  padding: 10px 14px; border-radius: var(--shiso-radius-inner);
  background: var(--shiso-soft); color: var(--shiso-soft-text);
}
.s-alert--ok { background: var(--shiso-ok-bg); color: var(--shiso-ok); }
.s-alert--warn { background: var(--shiso-warn-bg); color: var(--shiso-warn); }
.s-alert--bad { background: var(--shiso-bad-bg); color: var(--shiso-bad); }

/* Code: inline and block */
.shiso code { font-family: var(--shiso-font-mono); font-size: 0.92em; }
.s-code {
  margin: 0; padding: var(--shiso-space-3); overflow-x: auto;
  background: var(--shiso-fill); border-radius: var(--shiso-radius-inner);
  font-family: var(--shiso-font-mono); font-size: 0.92em; line-height: 1.5;
}

/* Facts: a small label over its value, laid out in columns */
.s-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; margin: 0; }
.s-facts > div { min-width: 0; }
.s-facts dt { font-size: var(--shiso-text-sm); color: var(--shiso-text-2); }
.s-facts dd { margin: 0; font-weight: var(--shiso-weight-medium); overflow-wrap: anywhere; }

/* Top bar for pages without a sidebar */
.s-topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--shiso-space-2) var(--shiso-space-4); padding: var(--shiso-space-3) var(--shiso-pad); }

/* App shell: sidebar sits on the canvas, content cards float above it */
.s-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.s-side { padding: var(--shiso-space-3) var(--shiso-space-2); display: flex; flex-direction: column; gap: var(--shiso-space-3); border-right: 1px solid var(--shiso-line); }
.s-main { padding: var(--shiso-pad); display: grid; gap: var(--shiso-gap); align-content: start; min-width: 0; }
.s-nav { display: grid; gap: 2px; }
.s-nav a {
  display: flex; align-items: center; gap: 10px; height: var(--shiso-control); padding: 0 10px;
  border-radius: var(--shiso-radius-control); color: var(--shiso-text-2); font-weight: var(--shiso-weight-medium); text-decoration: none;
}
.s-nav a:hover { background: var(--shiso-fill); text-decoration: none; }
.s-nav a[aria-current] { background: var(--shiso-card); color: var(--shiso-text); box-shadow: var(--shiso-shadow); }
.s-count { margin-left: auto; font-size: 0.82em; line-height: 1.6; padding: 0 7px; border-radius: var(--shiso-radius-full); background: var(--shiso-primary); color: var(--shiso-primary-text); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .s-shell { grid-template-columns: minmax(0, 1fr); }
  .s-side { display: none; }
}
@media (prefers-reduced-motion: reduce) { .shiso * { transition: none !important; } }
/* shiso-design: end */
  /* Page rules. Components come from the design system; Tailwind is used for layout utilities only. */
  .hidden { display: none !important; }
  .s-card { display: block; }
  .s-table th, .s-table td { padding-left: 0; }
  h1, h2, h3, p { margin: 0; }
  /* Keep show/hide working even if the Tailwind CDN is unreachable. */
  .hidden { display: none; }
  body { background: var(--shiso-canvas); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--shiso-line); border-radius: 4px; }
</style>
</head>
<body class="shiso min-h-screen">

<!-- Login overlay -->
<div id="login" class="hidden fixed inset-0 z-50 bg-canvas flex items-center justify-center">
  <form id="login-form" class="s-card w-80 space-y-4">
    <h1 class="s-h3">llm-router admin</h1>
    <p class="text-sm text-ink-2">Enter the admin token from your router config.</p>
    <input id="login-token" type="password" placeholder="admin token" autocomplete="current-password"
      class="s-input w-full">
    <p id="login-err" class="hidden text-sm text-bad">Invalid token.</p>
    <button class="s-btn s-btn--primary w-full">Sign in</button>
  </form>
</div>

<!-- App shell -->
<div id="app" class="hidden mx-auto max-w-6xl px-4 pb-16">
  <nav class="flex items-center justify-between py-5">
    <div class="flex items-center gap-8">
      <span class="s-h3">llm-router</span>
      <div class="s-seg">

        <a href="#/analytics" data-tab="analytics" class="tab">Analytics</a>

        <a href="#/models" data-tab="models" class="tab">Models</a>
        <a href="#/backends" data-tab="backends" class="tab">Backends</a>
        <a href="#/groups" data-tab="groups" class="tab">Groups</a>
      </div>

<!-- Modal + drawer mount points -->
<div id="modal-root"></div>
<div id="toast" class="hidden s-alert s-alert--bad fixed bottom-6 left-1/2 z-50 -translate-x-1/2 shadow-lg"></div>

<script>
"use strict";
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtInt = n => n == null ? "–" : Number(n).toLocaleString("en-US");
const fmtCost = c => c == null ? "–" : "$" + Number(c).toFixed(c >= 0.1 ? 3 : 5);
const fmtDate = iso => iso ? new Date(iso).toLocaleString() : "–";
const fmtMs = ms => ms == null ? "–" : Math.round(ms).toLocaleString("en-US") + " ms";
const pct = (part, whole) => whole > 0 ? part / whole * 100 : 0;
const sumBy = (rows, f) => rows.reduce((a, r) => a + (f(r) || 0), 0);

// The client's x-service-tier, when it asked for anything other than the
// default — shown under the tier's own name, which is what the caller set
// and what the provider's docs call it. Recorded on the in-flight entry
// and the finished row alike, so one badge serves both tables and the
// detail drawer; the caller supplies only the sizing, since a table cell
// and a drawer tag want different metrics.
const tierBadge = (r, cls) => r.service_tier
  ? `<span class="s-pill s-pill--warn ${cls}">${esc(r.service_tier)}</span>`
  : "";

// Input and output keep the same two colours everywhere they are split.
const IN_FILL = "fill-sky-500", OUT_FILL = "fill-violet-400";
const IN_TEXT = "text-soft-ink", OUT_TEXT = "text-ink";
const IN_DOT = "bg-sky-500", OUT_DOT = "bg-violet-400";
// Cached input is a third series in the charts only — the tables keep the
// two-way in/out split. Amber is far enough from both cool hues to stay
// separable under every colour-vision deficiency (checked: ΔE >= 17).
const CACHE_FILL = "fill-warn";
const CACHE_TEXT = "text-warn";
const CACHE_DOT = "bg-warn";

let TOKEN = localStorage.getItem("llmr_admin_token") || "";
// The one live-refresh timer on the page (the Logs tab's active panel).
// Cleared by the router, so leaving a tab always stops its polling.
let POLL = null;
let CATALOG = [];   // model definitions
let BACKENDS = [];  // backend views (secrets masked)
let GROUPS = [];    // exclusive groups (one per shared device)

// The window every chart and every usage query on the page covers. One
// global so the picker in a chart header keeps the whole view coherent.
// Mirrors ADMIN_KEY_ID in src/tokens.rs: the chat console's log rows are
// attributed to it, and it has no key page to link to.
const ADMIN_KEY_ID = "admin";

const RANGES = [7, 30, 90];
let RANGE_DAYS = Number(localStorage.getItem("llmr_range_days")) || 30;
if (!RANGES.includes(RANGE_DAYS)) RANGE_DAYS = 30;

const sinceParam = () => new Date(Date.now() - RANGE_DAYS * 86400e3).toISOString();

function setRange(days) {
  RANGE_DAYS = days;
  localStorage.setItem("llmr_range_days", String(days));
  route();
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add("hidden"), 4000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + TOKEN,
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try { msg = (await res.json()).error.message; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

// ---- auth ------------------------------------------------------------

function showLogin() {
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#login-token").focus();
}

function logout() {
  localStorage.removeItem("llmr_admin_token");
  TOKEN = "";
  showLogin();
}

$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  TOKEN = $("#login-token").value.trim();
  try {
    await loadCatalog();
    localStorage.setItem("llmr_admin_token", TOKEN);
    $("#login").classList.add("hidden");
    $("#login-err").classList.add("hidden");
    $("#login-token").value = "";
    boot();
  } catch {
    $("#login-err").classList.remove("hidden");
  }
});

// ---- router ----------------------------------------------------------

const TABS = ["keys", "analytics", "chat", "logs", "models", "backends", "groups"];

/// Hash routes with a segment of their own, most specific first. Each entry
/// maps its capture group to a render call.
const ROUTES = [
  [/^#\/keys\/(.+)$/, name => renderKeyDetail(name)],
  [/^#\/analytics\/models\/(.+)$/, name => renderDimensionDetail(MODEL_DIM, name)],
  [/^#\/analytics\/providers\/(.+)$/, name => renderDimensionDetail(PROVIDER_DIM, name)],
];

async function route() {
  clearInterval(POLL);
  POLL = null;
  const hash = location.hash || "#/keys";
  const tab = TABS.find(t => hash.startsWith("#/" + t)) || "keys";
  document.querySelectorAll(".tab").forEach(a =>
    a.toggleAttribute("aria-current", a.dataset.tab === tab));
  const detail = ROUTES.map(([re, render]) => [hash.match(re), render]).find(([m]) => m);
  try {
    if (detail) await detail[1](decodeURIComponent(detail[0][1]));
    else if (tab === "analytics") await renderAnalytics();
    else if (tab === "chat") await renderChat();
    else if (tab === "logs") await renderLogs();
    else if (tab === "models") await renderModels();
    else if (tab === "backends") await renderBackends();
    else if (tab === "groups") await renderGroups();
    else await renderKeys();
  } catch (e) {
    if (e.message !== "unauthorized") toast(e.message);
  }
}
window.addEventListener("hashchange", route);

/// The model + backend catalog is small and read by most views; keep one
/// copy in memory and refresh it after every catalog edit.
async function loadCatalog() {
  [CATALOG, BACKENDS, GROUPS] = await Promise.all([
    api("/admin/models"), api("/admin/backends"), api("/admin/groups")]);
}

async function boot() {
  $("#app").classList.remove("hidden");
  try { await loadCatalog(); } catch { return; }
  route();
}

if (TOKEN) boot(); else showLogin();

// ---- shared bits -----------------------------------------------------

function card(inner, cls = "") {
  return `<div class="s-card ${cls}">${inner}</div>`;
}

function progressBar(used, limit) {
  if (limit == null) return `<span class="text-ink-2 text-xs">no limit</span>`;
  const pct = limit > 0 ? Math.min(100, used / limit * 100) : 100;
  const color = pct >= 100 ? "bg-bad" : pct >= 75 ? "bg-warn" : "bg-primary";
  return `<div class="w-28">
    <div class="h-1.5 rounded bg-fill"><div class="h-1.5 rounded ${color}" style="width:${pct}%"></div></div>
    <div class="mt-1 text-[11px] text-ink-2">${pct.toFixed(0)}%</div>
  </div>`;
}

function dot(cls) {
  return `<span class="inline-block h-2 w-2 rounded-sm ${cls}"></span>`;
}

/// Points the Logs tab at one slice of the traffic. Every field the caller
/// leaves out is cleared, so a stale filter never rides along. Callers pass
/// the argument as JSON so names with quotes in them stay intact.
function setLogFilter(f) {
  Object.assign(LOG_FILTER, { token_id: "", model: "", backend: "" }, f);
}

// The chart stack, bottom to top. Cached input is split out because it is
// usually the bulk of the prompt and prices differently, so a two-way
// in/out split hides where the tokens actually went. `input` is therefore
// the *uncached* remainder — the segments sum to prompt + completion with
// nothing double-counted.
const SEGMENTS = [
  { key: "cached", name: "Cached input", fill: CACHE_FILL, text: CACHE_TEXT, dot: CACHE_DOT },
  { key: "input", name: "Input", fill: IN_FILL, text: IN_TEXT, dot: IN_DOT },
  { key: "output", name: "Output", fill: OUT_FILL, text: OUT_TEXT, dot: OUT_DOT },
];

const stackTotal = p => SEGMENTS.reduce((n, s) => n + p[s.key], 0);

// Hand-rolled SVG chart: one stacked bar per day. Segments carry a 2px
// surface gap so the boundaries read without relying on hue alone, and a
// transparent full-height rect per column carries the tooltip so thin bars
// stay hoverable.
function stackedBarChart(points) {
  const max = Math.max(...points.map(stackTotal));
  if (!points.length || max <= 0) {
    return `<div class="flex h-40 items-center justify-center text-sm text-ink-2">no usage yet</div>`;
  }
  const W = 900, H = 160, PAD = 4, GAP = 2;
  const bw = Math.max(4, Math.floor(W / points.length) - 3);
  const scale = v => Math.round((H - PAD * 2) * v / max);
  const bars = points.map((p, i) => {
    const x = i * (bw + 3);
    // Segment edges come off the running sum rather than from per-segment
    // heights, so independent rounding can't drift the stack off the
    // baseline; empty segments are skipped so they cost no gap.
    let acc = 0;
    const drawn = [];
    for (const seg of SEGMENTS) {
      if (p[seg.key] <= 0) continue;
      const bottom = scale(acc);
      acc += p[seg.key];
      drawn.push({ seg, bottom, top: Math.max(bottom + 1, scale(acc)) });
    }
    // The gap is taken out of the segment below it — shrinking, never
    // growing, so the bar stays inside its box however thin the slice is.
    const rects = drawn.map(({ seg, bottom, top }, n) => {
      const h = Math.max(1, top - bottom - (n < drawn.length - 1 ? GAP : 0));
      return `<rect x="${x}" y="${H - PAD - bottom - h}" width="${bw}" height="${h}" class="${seg.fill}"></rect>`;
    }).join("");
    const input = p.cached + p.input;
    const tip = SEGMENTS.map(seg => `${seg.name}: ${fmtInt(p[seg.key])}`
      + (seg.key === "cached" && input > 0 ? ` (${pct(p.cached, input).toFixed(0)}% of input)` : "")).join("\n");
    return `<g><title>${esc(`${p.label}\n${tip}\nTotal: ${fmtInt(stackTotal(p))} tok\nCost: ${fmtCost(p.cost)}`)}</title>
      <rect x="${x}" y="0" width="${bw}" height="${H}" class="fill-transparent hover:fill-fill/40"></rect>
      ${rects}
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="h-40 w-full">${bars}</svg>`;
}

/// The day-grouped rows padded out to one entry per day of the selected
/// range, so gaps in traffic render as gaps rather than being collapsed.
function rangeDayBuckets(rows) {
  const byDay = Object.fromEntries(rows.map(r => [r.bucket, r]));
  const out = [];
  for (let i = RANGE_DAYS - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400e3).toISOString().slice(0, 10);
    out.push({ day: d, row: byDay[d] });
  }
  return out;
}

function rangePicker() {
  return `<div class="s-seg">
    ${RANGES.map(d => `<button onclick="setRange(${d})" aria-pressed="${d === RANGE_DAYS}">${d}d</button>`).join("")}
  </div>`;
}

/// Daily token usage over the selected range, split cached input vs the
/// uncached remainder vs output. `prompt_tokens` includes the cached subset
/// (see logging.rs), so the remainder is the subtraction — clamped at zero
/// in case a provider ever reports a cached count above its own prompt
/// total. Spend rides along in the header and tooltips so the cost view
/// isn't lost.
function usageChart(rows) {
  const points = rangeDayBuckets(rows).map(({ day, row }) => {
    const prompt = row ? row.prompt_tokens || 0 : 0;
    const cached = Math.min(prompt, row ? row.cached_tokens || 0 : 0);
    return {
      label: day,
      cached,
      input: prompt - cached,
      output: row ? row.completion_tokens || 0 : 0,
      cost: row ? row.cost || 0 : 0,
    };
  });
  const totals = Object.fromEntries(SEGMENTS.map(s => [s.key, sumBy(points, p => p[s.key])]));
  const cost = sumBy(points, p => p.cost);
  const total = SEGMENTS.reduce((n, s) => n + totals[s.key], 0);
  return card(`<div class="p-5">
    <div class="flex flex-wrap items-baseline justify-between gap-2">
      <div class="flex items-center gap-3">
        <h2 class="text-sm font-medium text-ink-2">Tokens · last ${RANGE_DAYS} days</h2>
        ${rangePicker()}
      </div>
      <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 text-xs">
        ${SEGMENTS.map(s => `<span class="flex items-center gap-1.5 ${s.text}">${dot(s.dot)} ${s.name} ${fmtInt(totals[s.key])}</span>`).join("")}
        <span class="s-h2">${fmtInt(total)} tok</span>
        ${cost > 0 ? `<span class="text-ink-2">${fmtCost(cost)}</span>` : ""}
      </div>
    </div>
    <div class="mt-4">${stackedBarChart(points)}</div>
  </div>`);
}

/// A share-of-total bar: its width is the row's share of the table's tokens,
/// its fill the row's own input/output split.
function shareBar(r, whole) {
  const w = pct(r.total_tokens, whole);
  const split = r.prompt_tokens + r.completion_tokens;
  return `<div class="w-32">
    <div class="h-1.5 rounded bg-fill">
      <div class="flex h-1.5 overflow-hidden rounded" style="width:${w.toFixed(1)}%">
        <div class="${IN_DOT}" style="width:${pct(r.prompt_tokens, split)}%"></div>
        <div class="${OUT_DOT}" style="width:${pct(r.completion_tokens, split)}%"></div>
      </div>
    </div>
    <div class="mt-1 text-[11px] text-ink-2">${w.toFixed(1)}%</div>
  </div>`;
}

function statCard(title, s) {
  return card(`<div class="p-4">
    <div class="text-xs text-ink-2">${title}</div>
    <div class="s-h2 mt-1">${fmtCost(s.cost)}</div>
    <div class="mt-1 text-xs text-ink-2">${fmtInt(s.requests)} reqs${
      s.errors ? ` · <span class="text-bad">${fmtInt(s.errors)} err</span>` : ""}</div>
    ${inOutLine(s.prompt_tokens, s.completion_tokens)}
    ${s.avg_ttfb_ms != null ? `<div class="mt-0.5 text-[11px] text-ink-2">${fmtMs(s.avg_ttfb_ms)} ttfb</div>` : ""}
  </div>`);
}

function inOutLine(input, output) {
  return `<div class="mt-0.5 text-[11px]">
    <span class="${IN_TEXT}">${fmtInt(input)} in</span>
    <span class="text-ink-2"> · </span>
    <span class="${OUT_TEXT}">${fmtInt(output)} out</span>
  </div>`;
}

function modelOptions(selected) {
  return CATALOG.map(m =>
    `<option value="${esc(m.name)}" ${selected === m.name ? "selected" : ""}>${esc(m.name)}</option>`).join("");
}

function resetSelect(name, value) {
  return `<select name="${name}" class="s-select w-full">
    ${["never", "daily", "weekly", "monthly"].map(v =>
      `<option value="${v}" ${v === value ? "selected" : ""}>${v}</option>`).join("")}
  </select>`;
}

function modelChecks(name, selected) {
  return `<div class="s-inset grid grid-cols-2 gap-1 p-2 max-h-40 overflow-y-auto">
    ${CATALOG.map(m => `<label class="flex items-center gap-2 text-sm text-ink">
      <input type="checkbox" name="${name}" value="${esc(m.name)}"
        ${selected && selected.includes(m.name) ? "checked" : ""}
        class="accent-primary"> ${esc(m.name)}${
          m.private ? ' <span class="s-pill s-pill--warn">private</span>' : ""
        }</label>`).join("")}
  </div>`;
}

function allowlistChecks(allowed) {
  return `${modelChecks("allowed_models", allowed)}
  <p class="mt-1 text-xs text-ink-2">None checked = all public models. Private models always need to be checked.</p>`;
}

function flexChecks(flex) {
  return `${modelChecks("flex_models", flex)}
  <p class="mt-1 text-xs text-ink-2">Requests for these models are forced to the <code>flex</code> service tier, overriding the client's choice.</p>`;
}

function readKeyForm(form) {
  const num = v => v.trim() === "" ? null : Number(v);
  const checked = name => [...form.querySelectorAll(`input[name=${name}]:checked`)].map(c => c.value);
  const allowed = checked("allowed_models");
  const flex = checked("flex_models");
  return {
    name: form.name.value.trim(),
    credit_limit: num(form.credit_limit.value),
    credit_limit_reset: form.credit_limit_reset.value,
    token_limit: num(form.token_limit.value),
    token_limit_reset: form.token_limit_reset.value,
    allowed_models: allowed.length ? allowed : null,
    flex_models: flex.length ? flex : null,
  };
}

function keyFormFields(k = {}) {
  return `
    <label class="s-label block">Name
      <input name="name" required value="${esc(k.name || "")}"
        class="s-input mt-1 w-full"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="s-label block">Credit limit (USD)
        <input name="credit_limit" type="number" step="any" min="0" value="${k.credit_limit ?? ""}"
          placeholder="unlimited" class="s-input mt-1 w-full"></label>
      <label class="s-label block">Reset
        <div class="mt-1">${resetSelect("credit_limit_reset", k.credit_limit_reset || "never")}</div></label>
      <label class="s-label block">Token limit
        <input name="token_limit" type="number" step="1" min="0" value="${k.token_limit ?? ""}"
          placeholder="unlimited" class="s-input mt-1 w-full"></label>
      <label class="s-label block">Reset
        <div class="mt-1">${resetSelect("token_limit_reset", k.token_limit_reset || "never")}</div></label>
    </div>
    <div class="text-sm">Allowed models${allowlistChecks(k.allowed_models)}</div>
    <div class="text-sm">Force flex on models${flexChecks(k.flex_models)}</div>`;
}

function closeModal() { $("#modal-root").innerHTML = ""; }

function openModal(inner, width = "max-w-md") {
  $("#modal-root").innerHTML = `
    <div class="fixed inset-0 z-40 flex items-center justify-center bg-black/70 p-4" onclick="if(event.target===this)closeModal()">
      <div class="s-card max-h-[90vh] w-full ${width} overflow-y-auto">${inner}</div>
    </div>`;
}

const input = (name, attrs = "", value = "") =>
  `<input name="${name}" ${attrs} value="${esc(value)}"
     class="s-input mt-1 w-full">`;

// ---- analytics -------------------------------------------------------

/// How a usage bucket of each kind is named and linked. `bucket` carries
/// the group key (a model name, backend name or token id); `label` the
/// display name where the key is opaque.
const MODEL_DIM = {
  nullLabel: "unknown model",
  nameOf: r => r.bucket,
  hrefOf: r => r.bucket ? "#/analytics/models/" + encodeURIComponent(r.bucket) : null,
};
const PROVIDER_DIM = {
  // Requests rejected before dispatch — unknown model, quota, exhausted
  // failover — are logged without a backend.
  nullLabel: "not routed",
  nameOf: r => r.bucket,
  hrefOf: r => r.bucket ? "#/analytics/providers/" + encodeURIComponent(r.bucket) : null,
};
const KEY_DIM = {
  nullLabel: "deleted key",
  nameOf: r => r.label,
  // The admin console has a name but no key to open — it is synthetic.
  hrefOf: r => (r.label && r.bucket !== ADMIN_KEY_ID) ? "#/keys/" + encodeURIComponent(r.bucket) : null,
};

/// A ranked usage table — the shared shape behind every "what did we use
/// most" list. Rows arrive ordered by spend, then by volume.
function leaderboard(title, rows, dim, note = "") {
  const whole = sumBy(rows, r => r.total_tokens);
  const body = rows.map(r => {
    const name = dim.nameOf(r), href = dim.hrefOf(r);
    const cell = name == null
      ? `<span class="text-ink-2">${dim.nullLabel}</span>`
      : href
        ? `<a class="" href="${href}">${esc(name)}</a>`
        : `<span class="font-medium text-ink">${esc(name)}</span>`;
    return `<tr class="border-t border-line">
      <td class="px-4 py-3 text-sm">${cell}</td>
      <td class="px-4 py-3 text-sm text-ink">${fmtInt(r.requests)}
        ${r.errors ? `<div class="text-[11px] text-bad">${fmtInt(r.errors)} failed</div>` : ""}</td>
      <td class="px-4 py-3 text-sm text-ink">${fmtInt(r.total_tokens)}
        ${inOutLine(r.prompt_tokens, r.completion_tokens)}</td>
      <td class="px-4 py-3 text-sm text-ink">${fmtCost(r.cost)}</td>
      <td class="px-4 py-3 text-sm text-ink-2">${fmtMs(r.avg_ttfb_ms)}
        <div class="text-[11px] text-ink-2">${fmtMs(r.avg_duration_ms)} total</div></td>
      <td class="px-4 py-3">${shareBar(r, whole)}</td>
    </tr>`;
  }).join("");

  return `<div class="flex items-baseline justify-between">
      <h3 class="text-sm font-semibold text-ink">${title}</h3>
      ${note ? `<span class="text-xs text-ink-2">${note}</span>` : ""}
    </div>
    ${card(`<table class="s-table w-full text-left">
      <thead><tr class="text-xs text-ink-2">
        <th class="px-4 py-3">Name</th><th class="px-4 py-3">Requests</th>
        <th class="px-4 py-3">Tokens</th><th class="px-4 py-3">Cost</th>
        <th class="px-4 py-3">Avg TTFB</th><th class="px-4 py-3">Share</th>
      </tr></thead>
      <tbody>${body || '<tr><td colspan="6" class="px-4 py-8 text-center text-ink-2">Nothing in this range.</td></tr>'}</tbody>
    </table>`, "mt-2 overflow-x-auto")}`;
}

function totalTile(title, value, sub = "") {
  return card(`<div class="p-4">
    <div class="text-xs text-ink-2">${title}</div>
    <div class="s-h2 mt-1">${value}</div>
    <div class="mt-1 text-xs text-ink-2">${sub || "&nbsp;"}</div>
  </div>`);
}

async function renderAnalytics() {
  const since = "&since=" + encodeURIComponent(sinceParam());
  const [daily, models, providers, keys] = await Promise.all([
    api("/admin/usage?group_by=day" + since),
    api("/admin/usage?group_by=model" + since),
    api("/admin/usage?group_by=backend" + since),
    api("/admin/usage?group_by=token" + since),
  ]);
  const total = f => sumBy(daily, f);
  const requests = total(r => r.requests), errors = total(r => r.errors);

  $("#view").innerHTML = `
    <div class="flex items-center justify-between">
      <div>
        <h2 class="s-h3">Analytics</h2>
        <p class="mt-1 text-sm text-ink-2">Traffic over the last ${RANGE_DAYS} days, by model, provider and key.</p>
      </div>
    </div>

/// The API types the console offers, mirroring `ENDPOINTS` in
/// `admin/playground.rs`. `kind` decides which backends can serve each.
const CHAT_ENDPOINTS = [
  { path: "/v1/chat/completions", label: "Chat Completions", kind: "openai" },
  { path: "/v1/responses", label: "Responses", kind: "openai" },
  { path: "/v1/messages", label: "Messages (Anthropic)", kind: "anthropic" },
  { path: "/v1/embeddings", label: "Embeddings", kind: "openai" },
  { path: "/v1/audio/transcriptions", label: "Transcription (audio)", kind: "openai" },
  { path: "/v1/decisions", label: "Decisions (scoring)", kind: "openai" },
  { path: "/v1/systemone", label: "System One (scoring)", kind: "openai" },
];
const TRANSCRIPTIONS = "/v1/audio/transcriptions";
const DECISIONS = "/v1/decisions";
const SYSTEMONE = "/v1/systemone";
const isScoring = p => p === DECISIONS || p === SYSTEMONE;
/// `RESPONSE_FORMATS` in `admin/playground.rs`; "" is the provider default.
const TRANSCRIPTION_FORMATS = [
  ["", "json (default)"], ["text", "text"], ["verbose_json", "verbose_json"],
  ["diarized_json", "diarized_json (speakers)"], ["srt", "srt"], ["vtt", "vtt"],
];

// Survives tab switches: the transcript is worth keeping while you go and
// fix a backend, and picking up where you left off is the point.
const CHAT = {
  backend: "", model: "", path: "", system: "", max_tokens: "", temperature: "", messages: [], busy: false,
  // Transcription: the picked File itself (a file input can't be refilled
  // after a repaint, so it is kept here), plus its options.
  audio: null, language: "", response_format: "", keywords: "",
  // Scoring: the structured question list; the wire JSON is built from it
  // at send time, so the operator never types JSON.
  questions: [],
  // Scoring: the picked image Files (kept like the audio File, since a
  // file input cannot be refilled after a repaint); at send time they
  // become content blocks on decisions and `images` items on System One.
  images: [],
};

const backendNamed = name => BACKENDS.find(b => b.name === name);
const modelsOn = name => CATALOG.filter(m => m.targets.some(t => t.backend === name));
const endpointsOn = name => {
  const b = backendNamed(name);
  return b ? CHAT_ENDPOINTS.filter(e => b.kinds.includes(e.kind)) : [];
};
/// What the backend will actually be asked for: a target rename, else the
/// model name itself.
function upstreamModelFor(model, backend) {
  const t = (CATALOG.find(m => m.name === model) || { targets: [] }).targets.find(t => t.backend === backend);
  return (t && t.model) || model;
}

/// Keeps the three selections consistent: a provider that no longer exists,
/// a model with no target on it, or an API type its kinds do not serve all
/// fall back to the first valid option.
function ensureChatSelection() {
  if (!backendNamed(CHAT.backend)) CHAT.backend = BACKENDS.length ? BACKENDS[0].name : "";
  const models = modelsOn(CHAT.backend);
  if (!models.some(m => m.name === CHAT.model)) CHAT.model = models.length ? models[0].name : "";
  const paths = endpointsOn(CHAT.backend);
  if (!paths.some(e => e.path === CHAT.path)) CHAT.path = paths.length ? paths[0].path : "";
}

const options = (items, selected) => items.map(([value, label]) =>
  `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(label)}</option>`).join("");

const SELECT_CLS = "s-select mt-1 w-full";

function chatModelOptions() {
  return options(modelsOn(CHAT.backend).map(m => [m.name, m.name]), CHAT.model);
}
function chatPathOptions() {
  return options(endpointsOn(CHAT.backend).map(e => [e.path, e.label]), CHAT.path);
}

/// Exactly what the console is about to do, spelled out — most setup bugs
/// (wrong base URL, a rename that was meant to apply, an endpoint the
/// provider does not serve) are visible in this one line.
function chatPreview() {
  const b = backendNamed(CHAT.backend);
  if (!b || !CHAT.model || !CHAT.path) return `<span class="text-warn">Pick a provider, model and API type.</span>`;
  const upstream = upstreamModelFor(CHAT.model, CHAT.backend);
  return `POST <span class="text-ink">${esc(b.base_url.replace(/\/$/, ""))}${esc(CHAT.path)}</span>
    · model <span class="text-ink">${esc(upstream)}</span>
    ${upstream !== CHAT.model ? `<span class="text-ink-2">(renamed from ${esc(CHAT.model)})</span>` : ""}
    · billed to <span class="text-ink">admin console</span>`;
}

function paintChatSelects() {
  $("#chat-model").innerHTML = chatModelOptions();
  $("#chat-path").innerHTML = chatPathOptions();
  $("#chat-preview").innerHTML = chatPreview();
  paintComposer();
}

const fmtBytes = n => n < 1024 * 1024 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`;

/// The question kinds the editor offers. The router converts them to each
/// wire's spelling: decisions `predicate`/`choice`/`score` and System One
/// `noul`/`choice`/`score`.
const Q_TYPES = [["yes_no", "Yes / No (predicate)"], ["choice", "Choice"], ["score", "Score"]];

/// A fresh question row: an auto name (decisions answers a nameless question
/// by position; System One needs one), and ready-made option/level lists so
/// the common shapes need only filling in.
const newQuestion = () => ({
  id: "q" + (CHAT.questions.length + 1), type: "yes_no", question: "",
  options: ["", ""], levels: ["0", "1", "2"],
});

/// The option/level editor under a choice or score question: one input per
/// entry, each removable, plus the add button.
function qSubList(q, i) {
  const choice = q.type === "choice";
  const items = choice ? q.options : q.levels;
  const key = choice ? "opt" : "lvl";
  return `<div class="mt-2">
    <span class="text-xs text-ink-2">${choice ? "Options" : "Levels"}</span>
    <div class="mt-1 space-y-1">
      ${items.map((v, j) => `<div class="flex items-center gap-2">
        <input data-${key}="${i}:${j}" value="${esc(v)}" placeholder="${choice ? "option text" : "level label"}"
          class="s-input w-full">
        <button data-${key}del="${i}:${j}" title="Remove"
          class="s-btn s-btn--sm">&#10005;</button>
      </div>`).join("")}
    </div>
    <button data-${key}add="${i}"
      class="s-btn s-btn--sm mt-1">+ ${choice ? "Option" : "Level"}</button>
  </div>`;
}

/// The questions editor: one card per question — name, type, question text,
/// and for choice/score the inline option/level list. Values live in
/// CHAT.questions and every field writes through on input, so a repaint
/// (type change, add, remove) never loses what was typed.
function paintQuestions() {
  const box = $("#chat-qs");
  if (!box) return;
  box.innerHTML = CHAT.questions.map((q, i) => `
    <div class="s-inset p-3">
      <div class="grid items-end gap-2 md:grid-cols-[7rem_9rem_1fr_auto]">
        <label class="s-label block">Name
          ${input("qid", `data-q="${i}" data-f="id" placeholder="q${i + 1}"`, q.id)}</label>
        <label class="s-label block">Type
          <select data-q="${i}" data-f="type" class="s-select mt-1 w-full">${options(Q_TYPES, q.type)}</select></label>
        <label class="s-label block">Question
          ${input("qq", `data-q="${i}" data-f="question" placeholder="Is this about billing?"`, q.question)}</label>
        <button data-del="${i}" title="Remove question"
          class="s-btn s-btn--sm mb-1">&#10005;</button>
      </div>
      ${q.type === "yes_no"
        ? `<p class="mt-2 text-[11px] text-ink-2">Answered with the probability that the statement is true.</p>`
        : qSubList(q, i)}
    </div>`).join("")
    + `<button id="chat-qadd"
        class="s-btn s-btn--outline s-btn--sm w-full border-dashed">+ Add question</button>`;

  box.querySelectorAll("[data-q][data-f]").forEach(el => {
    const q = CHAT.questions[+el.dataset.q];
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", e => {
      q[el.dataset.f] = e.target.value;
      if (el.dataset.f === "type") paintQuestions();
    });
  });
  box.querySelectorAll("[data-del]").forEach(el =>
    el.addEventListener("click", () => { CHAT.questions.splice(+el.dataset.del, 1); paintQuestions(); }));
  for (const [key, field] of [["opt", "options"], ["lvl", "levels"]]) {
    box.querySelectorAll(`[data-${key}]`).forEach(el => {
      const [i, j] = el.dataset[key].split(":").map(Number);
      el.addEventListener("input", e => { CHAT.questions[i][field][j] = e.target.value; });
    });
    box.querySelectorAll(`[data-${key}del]`).forEach(el => el.addEventListener("click", () => {
      const [i, j] = el.dataset[key + "del"].split(":").map(Number);
      CHAT.questions[i][field].splice(j, 1);
      paintQuestions();
    }));
    box.querySelectorAll(`[data-${key}add]`).forEach(el => el.addEventListener("click", () => {
      CHAT.questions[+el.dataset[key + "add"]][field].push("");
      paintQuestions();
    }));
  }
  $("#chat-qadd").addEventListener("click", () => { CHAT.questions.push(newQuestion()); paintQuestions(); });
}

/// The question list in the editor's own JSON, which the router converts to
/// the chosen wire. Blank optional fields are dropped rather than guessed at:
/// a blank name is omitted (each route then applies its own rule), and
/// half-typed blank options or levels are not data — if that leaves a
/// question invalid, the route's own refusal is the honest result.
function questionsPayload() {
  return JSON.stringify(CHAT.questions.map(q => {
    const out = { type: q.type, question: q.question };
    const id = q.id.trim();
    if (id) out.id = id;
    if (q.type === "choice") out.options = q.options.map(s => s.trim()).filter(Boolean);
    if (q.type === "score") out.levels = q.levels.map(s => s.trim()).filter(Boolean);
    return out;
  }));
}

      </div>
      <div class="mt-2 flex items-center justify-between">
        <span class="text-xs text-ink-2">The system prompt, if set, is sent as the transcription <code>prompt</code>; keywords go as a <code>keywords</code> form field — the wire form of the SDK's <code>extra_body={"keywords": [...]}</code>, and support varies by provider.
          diarized_json needs a diarizing model (e.g. gpt-4o-transcribe-diarize).</span>

    $("#chat-audio").addEventListener("change", e => {

      <div id="chat-qs" class="mt-2 space-y-2"></div>
      <div class="mt-3">
        <div class="text-xs font-medium text-ink-2">Images</div>
        <input id="chat-images" type="file" accept="image/*" multiple
          class="mt-1 block w-full text-sm text-ink file:mr-3 file:rounded-lg file:border-0 file:bg-fill file:px-3 file:py-1.5 file:text-sm file:text-ink hover:file:bg-fill-hover">
        <div id="chat-img-chips" class="mt-2"></div>

      <textarea id="chat-input" rows="3" placeholder="${scoring ? "Text to score… (Enter to send)" : "Message… (Enter to send, Shift+Enter for a newline)"}"

/// The turns to send upstream: completed exchanges plus the newest
/// question. A failed attempt keeps its error bubble on screen but never
/// becomes history — it has no reply, and some APIs reject two user turns
/// in a row. An assistant turn carries the reasoning it came back with, so
/// a thinking model sees its own earlier reasoning and a server with a
/// prefix cache can continue from the end of the turn it generated.
function conversation() {
  const out = [];
  for (const m of CHAT.messages) {
    // Transcriptions share the screen but are not conversation turns.
    if (m.audio) continue;
    if (m.role !== "assistant") out.push({ role: "user", content: m.content });
    else if (m.ok) out.push({ role: "assistant", content: m.content, reasoning: m.reasoning || null });
    else out.pop();
  }
  return out;
}

async function sendChat() {
  const box = $("#chat-input");
  const text = box.value.trim();
  if (!text || CHAT.busy) return;
  if (!CHAT.backend || !CHAT.model || !CHAT.path) return toast("Pick a provider, model and API type first.");
  if (isScoring(CHAT.path) && !CHAT.questions.length) return toast("Add a question first.");

  // Read the pictures before the transcript changes: a file that cannot be
  // read should leave the conversation exactly as it was.
  let images = null;
  if (isScoring(CHAT.path) && CHAT.images.length) {
    try {
      images = await Promise.all(CHAT.images.map(async f => ({
        filename: f.name, content_type: f.type || null, data: await fileBase64(f),
      })));
    } catch (e) {
      return toast(`Could not read an image: ${e.message}`);
    }
  }

  CHAT.messages.push({ role: "user", content: text });
  box.value = "";
  CHAT.busy = true;
  paintTranscript();

  await runPlayground({
    messages: conversation(),
    max_tokens: num(CHAT.max_tokens),
    ...(images ? { images } : {}),
  });
}

const num = v => (String(v).trim() === "" ? null : Number(v));

/// Chips for the picked images, in the group-member chip styling, each with
/// a remove ×. The picker input empties itself after each pick (a file input
/// cannot be refilled), so the chips are the one view of the selection.
function paintImageChips() {
  const box = $("#chat-img-chips");
  if (!box) return;
  box.innerHTML = CHAT.images.map((f, i) =>
    `<span class="s-pill mr-1 mb-1 inline-block">${esc(f.name)} · ${fmtBytes(f.size)}` +
    `<button data-i="${i}" class="s-btn s-btn--ghost s-btn--sm ml-1 text-bad" aria-label="remove ${esc(f.name)}">×</button></span>`
  ).join("") || '<span class="text-xs text-ink-2">png, jpg, webp… sent with your message</span>';
  box.querySelectorAll("button[data-i]").forEach(b =>
    b.addEventListener("click", () => { CHAT.images.splice(Number(b.dataset.i), 1); paintImageChips(); }));
}

/// Reads a File as bare base64 (the data URL minus its prefix).
function fileBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",", 2)[1] || "");
    r.onerror = () => reject(r.error || new Error("could not read the file"));
    r.readAsDataURL(file);
  });
}

async function sendTranscription() {
  if (CHAT.busy) return;
  if (!CHAT.backend || !CHAT.model || !CHAT.path) return toast("Pick a provider, model and API type first.");
  const file = CHAT.audio;
  if (!file) return toast("Choose an audio file first.");

  const lang = CHAT.language.trim();
  const fmt = CHAT.response_format;
  const keywords = CHAT.keywords.split(",").map(k => k.trim()).filter(Boolean);
  CHAT.messages.push({
    role: "user", audio: true,
    content: `🎙 ${file.name} · ${fmtBytes(file.size)} · ${lang || "auto language"} · ${fmt || "json"}${keywords.length ? ` · ${keywords.length} keywords` : ""}`,
  });
  CHAT.busy = true;
  paintTranscript();

  let data;
  try {
    data = await fileBase64(file);
  } catch (e) {
    CHAT.messages.push({ role: "assistant", audio: true, ok: false, content: e.message, status: null });
    CHAT.busy = false;
    return paintTranscript();
  }
  await runPlayground({
    messages: [],
    audio: { filename: file.name, content_type: file.type || null, data },
    language: lang || null,
    response_format: fmt || null,
    keywords: keywords.length ? keywords : null,
  }, { audio: true });
}

/// One console call: sends the shared selections plus `extra`, appends the
/// reply (merged with `tag`) to the transcript, then fetches its log row.
async function runPlayground(extra, tag = {}) {
  let reply;
  try {
    const res = await api("/admin/playground", {
      method: "POST",
      body: JSON.stringify({
        backend: CHAT.backend,
        model: CHAT.model,
        path: CHAT.path,
        system: CHAT.system.trim() || null,
        temperature: num(CHAT.temperature),
        ...(isScoring(CHAT.path) ? { questions: questionsPayload() } : {}),
        ...extra,
      }),
    });
    reply = {
      ...tag,
      role: "assistant",
      ok: res.status >= 200 && res.status < 300,
      content: res.text || "",
      reasoning: res.reasoning || null,
      status: res.status,
      duration_ms: res.duration_ms,
      request_id: res.request_id,
      body: res.body,
    };
  } catch (e) {
    // A rejected console call (bad pairing, unreachable router) is itself
    // the test result, so it belongs in the transcript rather than a toast.
    reply = { ...tag, role: "assistant", ok: false, content: e.message, status: null };
  }
  CHAT.messages.push(reply);
  CHAT.busy = false;
  paintTranscript();

  if (reply.request_id) {
    const row = await fetchLogRow(reply.request_id);
    if (row) { reply.log = row; paintTranscript(); }
  }
}

/// Log rows are written by the async batching writer, so the row for a
/// just-finished request may not be there yet. Give up quietly: the reply
/// is already on screen, the usage line is a bonus.
async function fetchLogRow(id, tries = 8) {
  for (let i = 0; i < tries; i++) {
    try { return await api("/admin/logs/" + encodeURIComponent(id)); }
    catch (e) { if (e.message === "unauthorized") return null; }
    await new Promise(r => setTimeout(r, 200));
  }
  return null;
}

function statusPill(status) {
  if (status == null) return '<span class="s-pill s-pill--bad">failed</span>';
  const cls = status < 300 ? "s-pill--ok" : status < 500 ? "s-pill--warn" : "s-pill--bad";
  return `<span class="s-pill ${cls}">${status}</span>`;
}

/// The line under a reply: what the router did with it. Everything after
/// the status comes from the request_logs row, so it doubles as proof that
/// attribution, usage parsing and pricing all worked for this call.
function replyMeta(m) {
  const l = m.log;
  const bits = [statusPill(m.status)];
  if (m.duration_ms != null) bits.push(`${fmtInt(m.duration_ms)} ms`);
  if (l) {
    bits.push(`${esc(l.backend ?? "–")} · ${esc(l.upstream_model ?? "–")}`);
    if (l.prompt_tokens != null || l.completion_tokens != null) {
      bits.push(`<span class="${IN_TEXT}">${fmtInt(l.prompt_tokens)}</span> →
        <span class="${OUT_TEXT}">${fmtInt(l.completion_tokens)}</span> tok`);
    }
    if (l.cost != null) bits.push(fmtCost(l.cost));
    if (l.finish_reason) bits.push(esc(l.finish_reason));
    bits.push(`<a class="" onclick='openLog(${esc(JSON.stringify(l.id))})'>log</a>`);
  }
  return `<div class="mt-2 flex flex-wrap items-center gap-2 border-t border-line pt-2 text-[11px] text-ink-2">${bits.join('<span class="text-ink-2/60">·</span>')}</div>`;
}

function chatBubble(m) {
  if (m.role === "user") {
    return `<div class="flex justify-end">
      <div class="max-w-[80%] whitespace-pre-wrap rounded-xl bg-fill px-3 py-2 text-sm text-ink">${esc(m.content)}</div>
    </div>`;
  }
  const tone = m.ok ? "border-line bg-card" : "border-bad/40 bg-bad-bg";
  const thought = m.reasoning && m.reasoning.text
    ? `<details class="mb-2">
        <summary class="cursor-pointer text-[11px] text-ink-2">reasoning</summary>
        <div class="mt-1 max-h-64 overflow-auto whitespace-pre-wrap text-xs text-ink-2">${esc(m.reasoning.text)}</div>
      </details>`
    : "";
  const body = thought + (m.content
    ? `<div class="whitespace-pre-wrap text-sm ${m.ok ? "text-ink" : "text-bad"}">${esc(m.content)}</div>`
    : `<div class="text-sm text-ink-2">No text in the response — see the raw body.</div>`);
  return `<div class="flex justify-start">
    <div class="max-w-[85%] rounded-xl border ${tone} px-3 py-2">
      ${body}
      ${m.body !== undefined ? `<details class="mt-2">
        <summary class="cursor-pointer text-[11px] text-ink-2">raw response</summary>
        <pre class="s-code mt-1 max-h-64 text-ink-2">${esc(JSON.stringify(m.body, null, 2))}</pre>
      </details>` : ""}
      ${replyMeta(m)}
    </div>
  </div>`;
}

function paintTranscript() {
  const log = $("#chat-log");
  if (!log) return;
  log.innerHTML = CHAT.messages.map(chatBubble).join("")
    + (CHAT.busy ? `<div class="flex justify-start"><div class="s-card px-3 py-2 text-sm text-ink-2">…</div></div>` : "");
  const send = $("#chat-send");
  if (send) send.disabled = CHAT.busy;
  log.lastElementChild?.scrollIntoView?.({ block: "nearest" });
}

const PRICE_FIELDS = [
  ["input_per_mtok", "Input"],
  ["output_per_mtok", "Output"],
  ["cached_input_per_mtok", "Cached input"],
  ["cache_write_per_mtok", "Cache write"],
];

function priceFields(prefix, p) {
  return `<div class="grid grid-cols-4 gap-2">
    ${PRICE_FIELDS.map(([f, label]) => `<label class="s-label block">${label}
      ${input(prefix + f, 'type="number" step="any" min="0" placeholder="—"', p && p[f] != null ? p[f] : "")}
    </label>`).join("")}
  </div>
  <p class="mt-1 text-xs text-ink-2">USD per 1M tokens. Leave input+output blank for no pricing;
    blank cache rates fall back to the input rate. Embedding models bill input only — set output to 0.</p>`;
}

/// Reads the four price inputs sharing a prefix. Returns null when the
/// required pair is blank, and throws when only one of them is filled —
/// half-priced models would silently mis-bill.
function readPricing(form, prefix, what) {
  const num = name => {
    const el = form.querySelector(`[name="${prefix}${name}"]`);
    const v = (el && el.value || "").trim();
    return v === "" ? null : Number(v);
  };
  const inp = num("input_per_mtok"), out = num("output_per_mtok");
  if (inp == null && out == null) return null;
  if (inp == null || out == null) {
    throw new Error(`${what}: input and output prices must both be set`);
  }
  return {
    input_per_mtok: inp,
    output_per_mtok: out,
    cached_input_per_mtok: num("cached_input_per_mtok"),
    cache_write_per_mtok: num("cache_write_per_mtok"),
  };
}

function priceSummary(p) {
  if (!p) return '<span class="text-ink-2">unpriced</span>';
  return `${fmtCost(p.input_per_mtok)} in / ${fmtCost(p.output_per_mtok)} out
    <span class="text-ink-2">per 1M</span>`;
}

/// Aliases shown under the model name — they route identically, so they
/// are presented as extra names rather than as rows of their own.
function aliasList(aliases) {
  if (!aliases || !aliases.length) return "";
  return `<div class="mt-0.5 text-xs font-normal text-ink-2">
    also: ${aliases.map(esc).join(", ")}</div>`;
}

function targetChip(t) {
  const rename = t.model ? ` <span class="text-ink-2">→</span> ${esc(t.model)}` : "";
  // A fallback target is off the normal rotation, so its weight is only
  // meaningful against the other fallbacks — show the role, not the weight.
  const role = t.fallback_only
    ? '<span class="text-warn"> fallback</span>'
    : `<span class="text-ink-2"> ×${t.weight}</span>`;
  return `<span class="s-pill mr-1 inline-block">
    ${esc(t.backend)}${rename}${role}</span>`;
}

/// The route's deadline policy, as one short cell.
function qosSummary(m) {
  if (m.qos_max_wait_ms == null && m.qos_background_max_wait_ms == null) {
    return '<span class="text-ink-2">wait</span>';
  }
  const parts = [];
  if (m.qos_max_wait_ms != null) parts.push(`${m.qos_max_wait_ms} ms`);
  if (m.qos_background_max_wait_ms != null) {
    parts.push(`<span class="text-ink-2">bg ${m.qos_background_max_wait_ms} ms</span>`);
  }
  const noFallback = m.targets.some(t => t.fallback_only)
    ? "" : ` <span class="text-warn">(${esc(m.on_shed_without_fallback)}, no fallback)</span>`;
  return parts.join(" / ") + noFallback;
}

const KINDS = ["openai", "anthropic"];

const SCHEDULING_CLASSES = [
  ["unrestricted", "Unrestricted", "Not on a contended device. Only its own concurrency limit applies."],
  ["exempt", "Exempt", "On a device with a group, but never waits for the lease — for work cheap enough to interleave, like a small embedder."],
  ["grouped", "Grouped", "Takes turns holding the device's lease with the group's other grouped members. Requires a token cap."],
];

/// Why a backend is (or is not) scheduled, in one cell. The distinction
/// between exempt and unrestricted is the whole point of keeping them apart:
/// both are unscheduled, but only one of them sits on a contended device.
function schedulingSummary(b) {
  const limit = b.max_concurrency != null
    ? `<span class="text-ink-2"> ≤${b.max_concurrency} in flight</span>` : "";
  if (b.scheduling_class === "grouped") {
    return `<span class="s-pill s-pill--warn">leased: ${esc(b.exclusive_group_id || "?")}</span>
      <span class="text-ink-2 text-xs"> cap ${b.max_tokens_cap ?? "—"} tok</span>${limit}`;
  }
  if (b.scheduling_class === "exempt") {
    return `<span class="s-pill">exempt: ${esc(b.exclusive_group_id || "?")}</span>${limit}`;
  }
  return `<span class="text-ink-2 text-xs">unrestricted</span>${limit}`;
}

function credentialSummary(b) {
  if (b.api_key_env) return `<span class="text-ink-2">env: <code class="text-xs">${esc(b.api_key_env)}</code></span>`;
  if (b.has_api_key) return '<span class="text-ok">stored key</span>';
  return '<span class="text-ink-2">none</span>';
}

  form.max_tokens_cap.placeholder = cls === "grouped" ? "required" : "uncapped";
}

// ---- logs ------------------------------------------------------------

const LOG_FILTER = { token_id: "", model: "", backend: "", status: "" };
let LOG_CURSOR = null;

// Polled every ACTIVE_POLL_MS while the Logs tab is open. Elapsed times
// therefore tick at that granularity — no client-side clock, so what the
// panel shows is always a number the router actually reported.
const ACTIVE_POLL_MS = 2000;
// A request leaves the panel the moment its guard drops, which is also
// when its log row is handed to the *asynchronous* writer — so the row is
// not queryable for a few more milliseconds. Wait this long before
// re-reading the history, or the refresh races the write it is there for.
const HISTORY_SETTLE_MS = 500;

// Ids from the previous poll. A request that was in flight and no longer
// is has become a history row, which is the cue to re-read the first page.
let ACTIVE_IDS = new Set();

const fmtElapsed = ms => ms < 60000
  ? (ms / 1000).toFixed(1) + "s"
  : Math.floor(ms / 60000) + "m " + String(Math.floor(ms % 60000 / 1000)).padStart(2, "0") + "s";

// `queued` is the router's own admission control holding the request (a
// device lease or a concurrency slot); the other two are the provider's
// time. Colouring them differently is the whole point of the panel.
const PHASES = {
  queued: ["bg-warn", "text-warn", "queued"],
  upstream: ["bg-sky-500", "text-sky-400", "upstream"],
  streaming: ["bg-primary", "text-ok", "streaming"],
};

/// The Logs filters are applied here rather than on /admin/active: the
/// in-flight set is bounded by the router's concurrency limits, so it is
/// cheaper to filter three fields client-side than to keep a second copy
/// of the filter logic on the server. Status is not filterable — an
/// in-flight request has no status yet.
function activeMatches(r) {
  return (!LOG_FILTER.token_id || r.token_id === LOG_FILTER.token_id)
    && (!LOG_FILTER.model || r.model === LOG_FILTER.model)
    && (!LOG_FILTER.backend || r.backend === LOG_FILTER.backend);
}

function activeRowHtml(r) {
  const [dot, text, label] = PHASES[r.phase] ?? ["bg-ink-2", "text-ink-2", r.phase];
  return `
    <tr class="border-t border-line">
      <td class="whitespace-nowrap px-3 py-2.5 text-sm tabular-nums text-ink">${fmtElapsed(r.elapsed_ms)}</td>
      <td class="px-3 py-2.5 text-sm text-ink">${esc(r.token_name)}</td>
      <td class="px-3 py-2.5 text-sm text-ink">${esc(r.model)}${tierBadge(r, "ml-1.5 px-1.5 py-0.5 text-[10px]")}</td>
      <td class="px-3 py-2.5 text-sm text-ink-2">${esc(r.backend ?? "–")}</td>
      <td class="whitespace-nowrap px-3 py-2.5 text-sm ${text}">
        <span class="mr-1.5 inline-block h-1.5 w-1.5 animate-pulse rounded-full ${dot}"></span>${label}
        ${r.streamed ? '<span class="ml-1 text-[10px] text-ink-2">SSE</span>' : ""}</td>
      <td class="px-3 py-2.5 font-mono text-xs text-ink-2">${esc(r.path)}</td>
    </tr>`;
}

/// Renders (or hides) the panel. Hidden when nothing is in flight, so an
/// idle router shows the same Logs page it always did.
function renderActive(items) {
  const host = $("#active");
  if (!host) return;
  if (!items.length) {
    host.innerHTML = "";
    return;
  }
  host.innerHTML = `
    <div class="mt-3 flex items-center gap-2">
      <span class="inline-block h-2 w-2 animate-pulse rounded-full bg-primary"></span>
      <h3 class="text-sm font-semibold text-ink">In flight</h3>
      <span class="text-xs text-ink-2">${items.length} request${items.length === 1 ? "" : "s"}, longest-running first</span>
    </div>
    ${card(`<table class="s-table w-full text-left">
      <thead><tr class="text-xs text-ink-2">
        <th class="px-3 py-3">Elapsed</th><th class="px-3 py-3">Key</th><th class="px-3 py-3">Model</th>
        <th class="px-3 py-3">Provider</th><th class="px-3 py-3">Phase</th><th class="px-3 py-3">Endpoint</th>
      </tr></thead>
      <tbody>${items.map(activeRowHtml).join("")}</tbody>
    </table>`, "mt-2 overflow-x-auto")}`;
}

async function loadActive() {
  // A failed poll stops the timer: without this an expired token would
  // raise a toast every two seconds.
  try {
    const page = await api("/admin/active");
    const ids = new Set(page.items.map(r => r.id));
    // Compared against every id, not the count: one request finishing as
    // another starts leaves the count unchanged.
    const finished = [...ACTIVE_IDS].some(id => !ids.has(id));
    ACTIVE_IDS = ids;
    renderActive(page.items.filter(activeMatches));
    if (finished) setTimeout(refreshHistory, HISTORY_SETTLE_MS);
  } catch (e) {
    clearInterval(POLL);
    POLL = null;
    if (e.message !== "unauthorized") toast(e.message);
  }
}

function logQuery() {
  const p = new URLSearchParams();
  if (LOG_FILTER.token_id) p.set("token_id", LOG_FILTER.token_id);
  if (LOG_FILTER.model) p.set("model", LOG_FILTER.model);
  if (LOG_FILTER.backend) p.set("backend", LOG_FILTER.backend);
  if (LOG_FILTER.status) p.set("status", LOG_FILTER.status);
  if (LOG_CURSOR) p.set("cursor", LOG_CURSOR);
  p.set("limit", "50");
  return "/admin/logs?" + p.toString();
}

// prompt_tokens always includes cached_tokens, so this is the fraction of input served from cache.
function cacheRatio(r) {
  return pct(r.cached_tokens, r.prompt_tokens).toFixed(0) + "%";
}

function keyLabel(r) {
  return r.token_name
    ? esc(r.token_name)
    : '<span class="text-ink-2">deleted key</span>';
}

function logRowHtml(r) {
  const statusCls = r.status == null ? "text-ink-2"
    : r.status < 300 ? "text-ok" : r.status < 500 ? "text-warn" : "text-bad";
  return `
    <tr class="cursor-pointer border-t border-line hover:bg-fill/50" onclick='openLog(${JSON.stringify(r.id)})'>
      <td class="whitespace-nowrap px-3 py-2.5 text-xs text-ink-2">${fmtDate(r.created_at)}</td>
      <td class="px-3 py-2.5 text-sm text-ink">${keyLabel(r)}</td>
      <td class="px-3 py-2.5 text-sm text-ink">${esc(r.model)}${tierBadge(r, "ml-1.5 px-1.5 py-0.5 text-[10px]")}</td>
      <td class="px-3 py-2.5 text-sm text-ink-2">${esc(r.backend ?? "–")}</td>
      <td class="px-3 py-2.5 text-sm ${statusCls}">${r.status ?? "–"}${r.error ? ' <span title="has error">⚠</span>' : ""}</td>
      <td class="whitespace-nowrap px-3 py-2.5 text-sm">
        <span class="${IN_TEXT}">${fmtInt(r.prompt_tokens)}</span>
        <span class="text-ink-2">→</span>
        <span class="${OUT_TEXT}">${fmtInt(r.completion_tokens)}</span>
        ${r.cached_tokens ? `<span class="s-pill s-pill--soft ml-1">cached ${cacheRatio(r)}</span>` : ""}</td>
      <td class="px-3 py-2.5 text-sm">${fmtCost(r.cost)}</td>
      <td class="px-3 py-2.5 text-sm text-ink-2">${r.duration_ms != null ? r.duration_ms + " ms" : "–"}</td>
      <td class="px-3 py-2.5 text-sm text-ink-2">${esc(r.finish_reason ?? "–")}</td>
    </tr>`;
}

async function renderLogs() {
  LOG_CURSOR = null;
  ACTIVE_IDS = new Set();
  const keys = await api("/admin/tokens");
  $("#view").innerHTML = `
    <h2 class="s-h3">Request Logs</h2>
    <div class="mt-3 flex flex-wrap items-end gap-2 text-sm">
      <label class="s-label block">Key
        <select id="f-key" class="s-select mt-1 block">
          <option value="">all keys</option>
          ${keys.map(k => `<option value="${esc(k.id)}" ${LOG_FILTER.token_id === k.id ? "selected" : ""}>${esc(k.name)}</option>`).join("")}
        </select></label>
      <label class="s-label block">Model
        <select id="f-model" class="s-select mt-1 block">
          <option value="">all models</option>${modelOptions(LOG_FILTER.model)}
        </select></label>
      <label class="s-label block">Provider
        <select id="f-backend" class="s-select mt-1 block">
          <option value="">all providers</option>
          ${BACKENDS.map(b => `<option value="${esc(b.name)}" ${LOG_FILTER.backend === b.name ? "selected" : ""}>${esc(b.name)}</option>`).join("")}
        </select></label>
      <label class="s-label block">Status
        <input id="f-status" value="${esc(LOG_FILTER.status)}" placeholder="e.g. 200" size="6"
          class="s-input mt-1 block"></label>
      <button id="f-apply" class="s-btn">Apply</button>
    </div>
    <div id="active"></div>
    <h3 class="mt-4 text-sm font-semibold text-ink-2">History</h3>
    ${card(`<table class="s-table w-full text-left">
      <thead><tr class="text-xs text-ink-2">
        <th class="px-3 py-3">Time</th><th class="px-3 py-3">Key</th><th class="px-3 py-3">Model</th>
        <th class="px-3 py-3">Provider</th><th class="px-3 py-3">Status</th><th class="px-3 py-3">Tokens</th>
        <th class="px-3 py-3">Cost</th><th class="px-3 py-3">Duration</th><th class="px-3 py-3">Finish</th>
      </tr></thead>
      <tbody id="log-rows"></tbody>
    </table>
    <div class="border-t border-line p-3 text-center">
      <button id="log-more" class="s-btn hidden">Load more</button>
      <span id="log-empty" class="hidden text-sm text-ink-2">No requests logged.</span>
    </div>`, "mt-3 overflow-x-auto")}
    <div id="drawer"></div>`;

  $("#f-apply").addEventListener("click", () => {
    LOG_FILTER.token_id = $("#f-key").value;
    LOG_FILTER.model = $("#f-model").value;
    LOG_FILTER.backend = $("#f-backend").value;
    LOG_FILTER.status = $("#f-status").value.trim();
    refreshHistory();
    loadActive();
  });
  $("#log-more").addEventListener("click", loadLogPage);
  await loadLogPage();
  // The panel is live for as long as this tab is: the router clears POLL
  // on the next navigation.
  await loadActive();
  POLL = setInterval(loadActive, ACTIVE_POLL_MS);
}

/// Re-reads the history from the first page under the current filters —
/// what the Apply button does, and what a finished request triggers. The
/// guard covers a refresh scheduled just before the user navigated away.
function refreshHistory() {
  if (!$("#log-rows")) return;
  $("#log-rows").innerHTML = "";
  LOG_CURSOR = null;
  return loadLogPage();
}

async function loadLogPage() {
  const page = await api(logQuery());
  $("#log-rows").insertAdjacentHTML("beforeend", page.items.map(logRowHtml).join(""));
  LOG_CURSOR = page.next_cursor;
  $("#log-more").classList.toggle("hidden", !page.next_cursor);
  $("#log-empty").classList.toggle("hidden", $("#log-rows").children.length > 0);
}

async function openLog(id) {
  const r = await api("/admin/logs/" + encodeURIComponent(id));
  const field = (label, val, mono = false) => `
    <div class="flex justify-between gap-4 border-b border-line/60 py-2 text-sm">
      <span class="text-ink-2">${label}</span>
      <span class="${mono ? "font-mono text-xs" : ""} break-all text-right text-ink">${val}</span>
    </div>`;
  $("#drawer").innerHTML = `
    <div class="fixed inset-0 z-40 bg-black/50" onclick="$('#drawer').innerHTML=''"></div>
    <div class="fixed inset-y-0 right-0 z-50 w-full max-w-md overflow-y-auto border-l border-line bg-card p-5">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="s-h3">Request details</h3>
        <button onclick="$('#drawer').innerHTML=''" class="text-ink-2 hover:text-ink">✕</button>
      </div>
      <div class="mb-3 flex gap-2">
        <span class="s-pill">${esc(r.model)}</span>
        ${r.backend ? `<span class="s-pill">${esc(r.backend)}</span>` : ""}
        ${r.cached_tokens ? `<span class="s-pill s-pill--soft">Cached ${cacheRatio(r)}</span>` : ""}
        ${r.streamed ? '<span class="s-pill">streamed</span>' : ""}
        ${tierBadge(r, "px-2 py-0.5 text-xs")}
      </div>
      ${field("Time", fmtDate(r.created_at))}
      ${field("Request ID", esc(r.id), true)}
      ${field("Key", keyLabel(r))}
      ${field("Key ID", esc(r.token_id), true)}
      ${field("Path", esc(r.path), true)}
      ${field("Upstream model", esc(r.upstream_model ?? "–"))}
      ${field("Service tier", esc(r.service_tier ?? "default"))}
      ${field("Status", r.status ?? "–")}
      ${field("Finish reason", esc(r.finish_reason ?? "–"))}
      ${field("Prompt tokens", fmtInt(r.prompt_tokens))}
      ${field("Completion tokens", fmtInt(r.completion_tokens))}
      ${field("Cached tokens", r.cached_tokens ? `${fmtInt(r.cached_tokens)} <span class="text-ink-2">(${cacheRatio(r)} of input)</span>` : fmtInt(r.cached_tokens))}
      ${field("Cache write tokens", fmtInt(r.cache_write_tokens))}
      ${field("Total tokens", fmtInt(r.total_tokens))}
      ${field("Cost", fmtCost(r.cost))}
      ${field("Time to first byte", r.ttfb_ms != null ? r.ttfb_ms + " ms" : "–")}
      ${field("Duration", r.duration_ms != null ? r.duration_ms + " ms" : "–")}
      ${r.error ? `<div class="s-alert s-alert--bad mt-3">${esc(r.error)}</div>` : ""}
    </div>`;
}
</script>
</body>
</html>
