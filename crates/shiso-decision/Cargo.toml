[package]
name = "shiso-decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "shiso: decision models in-process - the answer arithmetic and the readout/head scoring, with no HTTP."

[dependencies]
# Token newtypes and the decision layout traits (`DecisionReadout`, `DecisionLayout`).
shiso-core = { workspace = true }
shiso-engine = { workspace = true }
shiso-models = { workspace = true }
# The vocabulary a decision prompt is encoded with; the checkpoint ships its own.
tokenizers = { workspace = true }
# Runtime-free one-shot channel, so `decide` is async with no executor of ours.
futures = { workspace = true }
tracing = { workspace = true }
# Model download: the registry client and blob store. The hub speaks HTTP as a
# client only; this crate pulls in no server stack.
shiso-hub = { workspace = true }
semver = { workspace = true }
# A private current-thread runtime drives the hub's async downloads from the
# blocking `ensure_model`.
tokio = { workspace = true }
thiserror = { workspace = true }
# Declared optional so the features below have a `dep:` target to enable.
shiso-metal = { workspace = true, optional = true }
shiso-cuda = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }

[features]
# Backend choice lives on the crate, as on shiso-server: empty default because
# Cargo features are target-independent. Neither feature is `NoDevice` at
# `Decider::open`; both is a build error.
metal = ["dep:shiso-metal"]
cuda = ["dep:shiso-cuda"]

[lints]
workspace = true
