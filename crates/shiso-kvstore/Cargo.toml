[package]
name = "shiso-kvstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "shiso: the KV cache - radix span tree, paged KV, GDN checkpoints, Marconi eviction, disk tier."

[dependencies]
# `shiso-core` is here for exactly one type: `TokenId`, the workspace-wide token
# newtype (rule 10). Nothing model-shaped is taken from it - geometry arrives as
# `CacheGeometry` and page bytes move through `Backing`, so each architecture
# derives its own numbers and this crate hardcodes none.
shiso-core = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# Disk-tier file names are sha1 digests of the token prefix and build they hold.
sha1 = { workspace = true }
# A restore reads a few hundred page files with several reads in flight, through
# the ring reader this crate already owns (and its blocking fallback off Linux).
shiso-ple = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
