[package]
name = "shiso-media-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "shiso: OS video decoders (VideoToolbox, NVDEC) and the AV1 decoder behind a safe API - the one place media FFI lives."

[features]
# The pure-Rust AV1 decoder. The OS decoders are always compiled; this adds the
# one codec a machine without an OS AV1 decoder still has to be able to read.
decode-native = ["dep:rav1d", "dep:libc"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# decode-native: the AV1 decoder, and libc for the errno values its C ABI
# returns (EAGAIN differs between macOS and Linux).
rav1d = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[lints]
workspace = true
