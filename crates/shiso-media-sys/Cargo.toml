[package]
name = "shiso-media-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "shiso: OS video decoders (VideoToolbox, NVDEC) and the AV1 decoder behind a safe API - the one place media FFI lives."

[features]
# The pure-Rust AV1 decoder. The OS decoders are always compiled; this adds the
# one codec a machine without an OS AV1 decoder still has to be able to read.
decode-native = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# VideoToolbox, through the objc2 framework bindings. A target table, not a
# feature: the OS decoder is always compiled where the OS has one.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { workspace = true, features = ["std", "objc2", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { workspace = true, features = ["std", "objc2", "VTBase", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTSession", "VTUtilities", "block2", "objc2-core-media", "objc2-core-video"] }

[lints]
workspace = true
