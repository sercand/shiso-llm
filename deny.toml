# cargo-deny configuration for shiso.
#
# The allow-list below governs third-party code. The workspace's own crates are
# skipped by the `[licenses.private]` section at the bottom, which is the part
# that has to be stated rather than assumed: `publish = false` alone does NOT
# make the licenses check ignore a crate, and every workspace crate here failed
# as `unlicensed` the first time this gate was actually run.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; the proc-macro is feature-complete and arrives through the tokenizers dependency tree" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

# The project's own crates are MIT and none of them is published. This is the
# switch that skips them, rather than the `publish` flag doing it implicitly -
# which it does not.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# warn, not deny: workspace crates inherit each other through path deps that
# resolve to `*` in Cargo.lock. Cargo.lock is committed and the advisories check
# is strict, so defence-in-depth stays.
wildcards = "warn"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No allow-git entries: there are no git dependencies. Keep it that way.
