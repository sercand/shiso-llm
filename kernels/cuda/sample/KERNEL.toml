# The `sample` module: what the engine does to a logits row before anything
# picks from it. Two entries: the suppress stage, which keeps the control
# tokens a model must never generate - a turn opener, a media marker - out of
# every pick taken on the device, and the top of a row, which a host draw with
# a top-k stage reads in place of the whole row.
#
# Written for this repository; nothing here is a byte copy, so no unit carries
# a provenance header.

[build]
sources = ["sample.cu"]

includes = ["cuda/sample"]

# The floor the rest of the tree is pinned at. Nothing here needs more than
# warp ballots and shared atomics, so it would build lower; one architecture
# across the tree is one less thing to reason about when a number disagrees.
arch = ["compute_80"]

[modules]
sample = "sample"
